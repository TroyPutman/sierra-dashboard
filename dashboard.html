<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Sierra Morning Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Sierra Air Conditioning & Plumbing â€” light brand theme.
       Brand swap = these 3 lines: --brand (blue), --gold, --red (from the logo/site). */
    --brand:#0a66b0; --brand-dark:#08427a; --gold:#f4a522; --red:#c42b28;
    --bg:#ffffff; --panel:#f2f6fb; --panel2:#e8eff7; --text:#12243b; --sub:#35455c;
    --dim:#5c6b80; --dim2:#54607a; --hair:#d4deea; --accent:var(--brand);
    --ok:#1f9d55; --warn:#b4540a; --err:#c42b28;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:var(--bg); color:var(--text); height:100vh; overflow:hidden;
    font-family:'Poppins',"Segoe UI Variable Display","Segoe UI",system-ui,Roboto,Arial,sans-serif;
    display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;}
  .num{font-variant-numeric:tabular-nums;}

  /* persistent header */
  header{flex:0 0 auto; display:flex; align-items:center; gap:20px; padding:12px 30px 11px;
     background:#fff; border-bottom:3px solid var(--brand); box-shadow:0 1px 6px rgba(8,66,122,.06);}
  .logo{height:52px; width:52px; border-radius:50%; flex:0 0 auto; object-fit:contain;}
  .brand{display:flex; flex-direction:column; line-height:1.05; white-space:nowrap;}
  .brand .b1{font-size:1.2rem; font-weight:700; letter-spacing:.01em; color:var(--brand-dark);}
  .brand .b2{font-size:.6rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);}
  nav{display:flex; gap:6px;}
  .tab{font-size:1rem; font-weight:600; color:var(--dim); background:transparent; border:none;
       padding:8px 15px; border-radius:999px; cursor:pointer;}
  .tab:hover{color:var(--brand);}
  .tab.active{color:#fff; background:var(--brand);}
  /* The HR link is styled apart from the real tabs on purpose: it leaves the dashboard, and on a
     wall screen during a meeting it should not read as just another panel to flick through. */
  .tab.tablink{text-decoration:none; border:1px solid var(--hair); opacity:.7;}
  .tab.tablink:hover{opacity:1; color:var(--brand);}
  .status{margin-left:auto; display:flex; align-items:center; gap:14px; white-space:nowrap;}
  input[type=date],input[type=month]{background:#fff; color:var(--text); border:1px solid var(--hair);
       border-radius:9px; padding:7px 11px; font-size:1rem; color-scheme:light;}
  .when{font-size:.9rem; color:var(--dim); text-align:right; line-height:1.25;}
  .when b{color:var(--text); font-weight:600;}
  .pill{font-size:.74rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:5px 12px; border-radius:999px;}
  .pill.prog{color:#4a3400; background:var(--gold);}
  .pill.final{color:var(--sub); background:#e3eaf3;}

  main{flex:1 1 auto; overflow-y:auto; overflow-x:hidden;}
  .panel{display:none;}
  .panel.active{display:block;}

  .banner{margin:16px 30px; padding:14px 20px; border-radius:12px; background:rgba(196,43,40,.10);
     border:1px solid rgba(196,43,40,.28); color:#8f1f1c; font-size:1.15rem; font-weight:600; display:none;}
  .banner.show{display:block;}

  /* OVERVIEW - fills exactly one screen, never scrolls */
  #overview.active{display:grid;}
  #overview{height:100%; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr);
     gap:14px; padding:14px 30px 22px;}
  .tile{background:var(--panel); border:1px solid var(--hair); box-shadow:0 1px 4px rgba(8,66,122,.05);
     border-radius:18px; padding:22px 28px; position:relative;
     display:flex; flex-direction:column; justify-content:center; gap:10px; overflow:hidden;}
  .tlabel{font-size:1.1rem; font-weight:700; letter-spacing:.05em; color:var(--brand); text-transform:uppercase;}
  .tnum{font-size:clamp(3.4rem,8.4vw,7.6rem); font-weight:650; line-height:.86; letter-spacing:-.02em;}
  .tsub{font-size:1.35rem; color:var(--sub); font-weight:500;}
  .tsub .q{color:var(--dim);}
  .tcav{font-size:.85rem; color:var(--dim2); line-height:1.3;}
  .tpulled{position:absolute; top:16px; right:20px; font-size:.72rem; color:var(--dim2);}
  .tpulled.stale{color:var(--warn);}
  .verstamp{font-size:.66rem; color:var(--dim2); text-align:right; line-height:1.25; white-space:nowrap;}
  .verstamp.staleflag{color:#fff; background:var(--warn); font-weight:700; padding:6px 10px;
     border-radius:8px; text-align:left; white-space:normal;}
  .tile.err .tnum{font-size:2rem; color:var(--err);}
  .dual{display:flex; gap:44px;}
  .dual .u{font-size:.9rem; color:var(--dim); text-transform:uppercase; letter-spacing:.05em;}
  .dual .v{font-size:clamp(2.6rem,5vw,4.4rem); font-weight:650; line-height:1;}

  /* CALLS - one tile per business unit (booked is the hero), grouped by trade */
  .callsec{display:flex; align-items:baseline; gap:14px; margin:22px 0 8px;}
  .callsec.first{margin-top:10px;}
  .callsec .gl{font-size:1.05rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--brand-dark);}
  .callsec .gs{font-size:.92rem; color:var(--dim);}
  .callsec .gs b{color:var(--text); font-weight:700;}
  .callgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:16px;}
  .calltile{background:var(--panel); border:1px solid var(--hair); box-shadow:0 1px 4px rgba(8,66,122,.05);
     border-radius:18px; padding:20px 26px 22px; display:flex; flex-direction:column; gap:5px;}
  .calltile .cu{font-size:1.15rem; font-weight:700; letter-spacing:.03em; color:var(--brand); text-transform:uppercase;}
  .calltile .cbl{font-size:.82rem; font-weight:600; letter-spacing:.06em; color:var(--dim); text-transform:uppercase; margin-top:2px;}
  .calltile .cb{font-size:clamp(3.2rem,5.2vw,5.2rem); font-weight:650; line-height:.86; letter-spacing:-.02em; color:var(--text);}
  .calltile .cc{font-size:1.35rem; font-weight:500; color:var(--sub); margin-top:4px;}
  .calltile .cc b{font-weight:700; color:var(--text);}
  .calltile .cc .q{color:var(--dim);}

  /* SILO / ROPP - dark analytical module (scoped under .silowrap; matches John's ROPP look) */
  @keyframes sp{ to{ transform:rotate(360deg); } }
  @keyframes silogrow{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
  .silowrap{ color:#eaf1fb; border-radius:16px; margin:16px 24px 30px; padding:20px 24px 24px;
     min-height:calc(100% - 46px); border:1px solid #1b2942;
     background:radial-gradient(1100px 360px at 12% -12%,rgba(244,165,34,.10),transparent),
                radial-gradient(900px 460px at 100% 0%,rgba(46,120,199,.16),transparent), #0b1220;}
  .silohead{ display:flex; align-items:baseline; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
  .silohead h2{ font-size:1.5rem; font-weight:700; color:#fff; letter-spacing:.01em; }
  .silohead .mo{ font-size:1.15rem; font-weight:700; color:#f4a522; }
  .silochip{ font-size:.72rem; font-weight:700; letter-spacing:.07em; color:#9fb2cc;
     background:rgba(255,255,255,.05); border:1px solid #24344f; padding:3px 10px; border-radius:12px; }
  .silohero{ display:grid; grid-template-columns:minmax(290px,360px) 1fr; gap:18px; align-items:stretch; }
  .silocard{ background:linear-gradient(160deg,#131c30,#0e1626); border:1px solid #22304d; border-radius:16px; padding:16px 18px; }
  .silogauge{ display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .silogauge .cap{ font-size:.72rem; letter-spacing:.14em; color:#7089ab; font-weight:700; text-transform:uppercase; }
  .silogauge .sub{ font-size:.85rem; color:#9fb2cc; margin-top:-4px; }
  .silotileset{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .silotile{ background:#131c30; border:1px solid #22304d; border-left:3px solid var(--a,#2E78C7);
     border-radius:13px; padding:15px 16px; display:flex; flex-direction:column; justify-content:center; }
  .silotile .l{ font-size:.7rem; letter-spacing:.1em; color:#7089ab; font-weight:700; text-transform:uppercase; }
  .silotile .v{ font-size:clamp(2.2rem,3.4vw,3rem); font-weight:800; line-height:1; margin-top:6px; color:#eaf1fb; font-variant-numeric:tabular-nums; }
  .silotile .s{ font-size:.76rem; color:#7089ab; margin-top:7px; }
  .silolb{ background:linear-gradient(160deg,#131c30,#0e1626); border:1px solid #22304d; border-radius:16px; padding:16px 18px 8px; margin-top:18px; }
  .silolb h3{ font-size:.8rem; letter-spacing:.08em; color:#9fb2cc; text-transform:uppercase; font-weight:700; margin-bottom:10px; }
  .lbrow{ display:grid; grid-template-columns:28px 172px 1fr 52px 52px 58px; align-items:center; gap:12px; padding:7px 0; }
  .lbrow+.lbrow{ border-top:1px solid rgba(255,255,255,.05); }
  .lbrank{ font-size:.95rem; color:#7089ab; font-weight:700; text-align:center; }
  .lbname{ font-size:1rem; color:#eaf1fb; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lbtrack{ background:rgba(255,255,255,.06); border-radius:6px; height:16px; overflow:hidden; }
  .lbfill{ height:100%; border-radius:6px; background:linear-gradient(90deg,#0a66b0,#f4a522); transform-origin:left; animation:silogrow .8s ease both; }
  .lbnum{ font-size:1rem; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; color:#eaf1fb; }
  .lbnum.muted{ color:#9fb2cc; font-weight:600; }
  .lbhdr .lbnum{ font-size:.66rem; letter-spacing:.08em; color:#6b7d99; font-weight:700; }
  .silocav{ font-size:.82rem; color:#8ea3c0; margin-top:16px; line-height:1.45; }
  .silocav b{ color:#f4a522; }
  .silo-computing{ padding:70px 20px; text-align:center; color:#9fb2cc; }
  .silo-computing .big{ font-size:1.5rem; font-weight:700; color:#fff; margin:14px 0 8px; }
  .silo-computing .spin{ display:inline-block; width:34px; height:34px; border:4px solid #24344f;
     border-top-color:#f4a522; border-radius:50%; animation:sp 1s linear infinite; }
  .silo-err{ background:rgba(220,60,60,.14); border:1px solid rgba(220,60,60,.4); color:#ffb4ae; border-radius:12px; padding:14px 18px; font-weight:600; }

  /* DETAIL tabs - scroll freely, show everything */
  .wrap{padding:18px 30px 40px;}
  .head{display:flex; align-items:baseline; gap:20px; margin-bottom:10px;}
  .head h2{font-size:1.6rem; font-weight:600;}
  .head .kpi{margin-left:auto; font-size:1.05rem; color:var(--dim);}
  .head .kpi b{color:var(--text); font-weight:650; font-size:1.6rem; margin-left:6px;}
  h3{font-size:.86rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:18px 0 6px;}
  .cols{display:flex; gap:44px; align-items:flex-start; flex-wrap:wrap;}
  .col{flex:1; min-width:340px;}

  /* incomplete-payroll / workweek-in-progress warning badges (wall-display visible) */
  .otwarn{margin:6px 0; padding:9px 14px; border-radius:10px; background:var(--warn); color:#fff;
     font-weight:700; font-size:.95rem; line-height:1.3; box-shadow:0 1px 4px rgba(0,0,0,.15);}
  .otwarn.small{font-size:.72rem; padding:5px 10px; border-radius:8px; margin:6px 0 0;}
  .otdual{display:flex; gap:36px; margin:4px 0 2px;}
  .otdual .u{font-size:.8rem; color:var(--dim); text-transform:uppercase; letter-spacing:.05em;}
  .otdual .v{font-size:clamp(1.8rem,3.4vw,2.6rem); font-weight:650; line-height:1;}

  table{width:100%; border-collapse:collapse;}
  th{font-size:.78rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--dim);
     text-align:left; padding:8px 14px 8px; position:sticky; top:0; z-index:2;
     background:var(--bg); box-shadow:0 1px 0 var(--hair);}
  th.r,td.r{text-align:right;}
  td{padding:9px 14px; font-size:1.5rem; font-weight:500;}
  tr+tr td{border-top:1px solid var(--hair);}
  .big td{font-size:2rem; font-weight:550; padding:12px 14px;}
  .det td{font-size:1.02rem; font-weight:450; padding:7px 14px;}
  .det td.q{color:var(--dim);}
  tfoot td{font-size:1.35rem; font-weight:700; color:var(--brand-dark); border-top:2px solid var(--hair); padding-top:12px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px 20px; margin:4px 0 16px;}
  .chip{font-size:1.05rem; color:var(--dim);}
  .chip b{color:var(--text); font-weight:650; font-size:1.3rem; margin-left:7px;}
  .cav{font-size:.85rem; color:var(--dim2); margin-top:10px; line-height:1.4;}
  .members{display:flex; gap:44px; align-items:baseline; margin-top:6px;}
  .members .big2{font-size:clamp(3rem,6vw,5rem); font-weight:650; line-height:1;}
  .members .side{color:var(--dim); font-size:1.15rem; line-height:1.8;}

  /* cancellations: filters + rankings */
  .cxbar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:14px 0 4px;}
  .cxbar .lbl{font-size:.9rem; color:var(--dim); font-weight:600;}
  .cxtag{font-size:.98rem; font-weight:600; padding:5px 13px; border-radius:999px; border:1px solid var(--hair);
     background:#fff; color:var(--sub); cursor:pointer; white-space:nowrap;}
  .cxtag:hover{border-color:var(--brand); color:var(--brand);}
  .cxtag.on{background:var(--brand); border-color:var(--brand); color:#fff;}
  .cxtag.on b{color:#fff;}
  .cxtag b{color:var(--brand-dark); margin-left:5px;}
  .cxtag .x{margin-left:8px; font-weight:800;}
  .cxclear{font-size:.92rem; font-weight:700; color:var(--red); background:transparent; border:none; cursor:pointer; padding:5px 4px;}
  .cxcount b{color:var(--text); font-weight:700;}
  .rank{width:100%; border-collapse:collapse;}
  .rank td{padding:7px 10px; font-size:1.15rem; border-top:1px solid var(--hair); cursor:pointer; vertical-align:middle;}
  .rank tr:first-child td{border-top:none;}
  .rank tr:hover td{background:var(--panel2);}
  .rank tr.on td{background:rgba(10,102,176,.12);}
  .rank .nm{color:var(--text); font-weight:600;}
  .rank .barcell{width:42%;}
  .rank .bar{height:8px; border-radius:4px; background:var(--brand); min-width:4px;}
  .rank tr.on .bar{background:var(--brand-dark);}
  .rank .ct{text-align:right; color:var(--brand-dark); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .rank .more td{cursor:default; color:var(--dim); font-size:.95rem; font-weight:500;}
  .rank .more:hover td{background:transparent;}
  td.cxcell{cursor:pointer;}
  td.cxcell:hover{color:var(--brand); text-decoration:underline;}
  .hint{font-size:.85rem; color:var(--dim);}

  /* maintenance calendar */
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-top:4px;}
  .cal-wd{font-size:.75rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em;
     color:var(--dim); text-align:center; padding-bottom:2px;}
  .cal-cell{background:var(--panel); border:1px solid var(--hair); border-radius:12px; padding:10px 8px 12px; min-height:112px;
     display:flex; flex-direction:column; align-items:center; gap:5px;}
  .cal-cell.blank{background:transparent; border:none;}
  .cal-cell.hole{background:transparent; border:1px dashed #b9c6d8;}
  .cal-cell.weekend{background:var(--panel2); border:1px solid var(--hair);}
  .cal-date{font-size:.82rem; color:var(--dim);}
  .cal-total{font-size:2.4rem; font-weight:650; line-height:1;}
  .cal-cell.weekend .cal-total{color:var(--dim);}
  .cal-cell.weekend .cal-split, .cal-cell.weekend .cal-split b{color:var(--dim);}
  .cal-hole{font-size:1.8rem; color:var(--dim2); margin-top:8px;}
  .cal-split{display:flex; gap:14px; font-size:.92rem; color:var(--dim);}
  .cal-split.three{gap:9px; font-size:.82rem;}
  .cal-split b{color:var(--text); font-weight:650;}
  .cal-foot{font-size:.72rem; color:var(--dim2); margin-top:4px;}
  .cal-nonopp{font-size:.72rem; color:var(--dim2); margin-top:3px;}
  .cal-cell.weekend .cal-nonopp{color:var(--dim2);}
  .cal-wknd-tag{font-size:.66rem; color:var(--dim2); text-transform:uppercase; letter-spacing:.04em;}
  .cal-cell[data-cbday]{cursor:pointer;}
  .cal-cell[data-cbday]:hover{border-color:var(--brand);}
  .cal-cell.sel{outline:2px solid var(--brand); outline-offset:-1px; border-color:var(--brand);}
  .cal-legend{font-size:.72rem; color:var(--dim2); margin-top:6px;}
  /* call-type breakdown for the selected day */
  .cbtypes{margin-top:16px;}
  .cbtypes h3{margin-bottom:4px;}
  table.cbtype{width:auto; min-width:60%; border-collapse:collapse;}
  table.cbtype th{font-size:.74rem; padding:6px 20px 6px 0; text-align:left;}
  table.cbtype th.r, table.cbtype td.r{text-align:right; padding-right:0; padding-left:26px;}
  table.cbtype td{font-size:1.35rem; font-weight:500; padding:8px 20px 8px 0;}
  table.cbtype td.bk{font-weight:650; color:var(--brand-dark);}
  table.cbtype td.tot{font-weight:700;}
  table.cbtype td.z{color:var(--dim2);}
  table.cbtype td.opp{font-weight:700; color:var(--text);}
  table.cbtype td.non{font-weight:500; color:var(--dim);}
  table.cbtype tr.sub td.bk{font-weight:500; color:var(--dim); padding-left:24px;}
  table.cbtype tr.grp td.bk{font-weight:700; color:var(--brand-dark);}
  .cal-legend .nonopp-key{color:var(--dim2); font-weight:600;}
  .cal-legend .swatch{display:inline-block; width:10px; height:10px; border-radius:3px; background:var(--panel2); border:1px solid var(--hair); vertical-align:middle; margin:0 5px 1px 12px;}

  /* REVENUE - three hero numbers (Today/MTD/YTD) + per-BU breakdown */
  .revgrid{display:flex; gap:22px; margin:6px 0 20px; flex-wrap:wrap;}
  .revhero{background:var(--panel); border:1px solid var(--hair); box-shadow:0 1px 4px rgba(8,66,122,.05);
     border-radius:18px; padding:20px 30px 22px; flex:1; min-width:300px;}
  .revhero .rl{font-size:1rem; font-weight:700; letter-spacing:.05em; color:var(--brand); text-transform:uppercase;}
  .revhero .rv{font-size:clamp(2.4rem,4.6vw,3.8rem); font-weight:650; line-height:1; margin-top:10px;
     letter-spacing:-.01em; font-variant-numeric:tabular-nums; color:var(--text);}
  .revhero.today{border-color:var(--gold); box-shadow:0 1px 8px rgba(244,165,34,.18);}
  /* NOT FINAL caveat — calmed down: muted explanatory text with a small warn-colored badge so it
     still reads as a caveat without shouting across the room. */
  .revcav{font-size:.8rem; color:var(--dim); font-weight:500; margin:2px 0 14px; line-height:1.35;}
  .revcav .nf{display:inline-block; font-size:.66rem; font-weight:700; letter-spacing:.05em;
     color:var(--warn); border:1px solid var(--warn); border-radius:5px; padding:0 5px; margin-right:6px;
     text-transform:uppercase; opacity:.85;}
  /* "How this is calculated" collapsible (Revenue tab notes). Quiet toggle; body hidden until open. */
  .revnotes{margin-top:6px;}
  .revnotes-toggle{background:none; border:none; padding:0; cursor:pointer; font:inherit;
     font-size:.74rem; font-weight:600; color:var(--dim); letter-spacing:.01em;}
  .revnotes-toggle::before{content:"\25B8\00a0"; color:var(--dim);}
  .revnotes.open .revnotes-toggle::before{content:"\25BE\00a0";}
  .revnotes-toggle:hover{color:var(--brand); text-decoration:underline;}
  .revnotes-body{display:none; margin-top:4px;}
  .revnotes.open .revnotes-body{display:block;}
  /* SILO flip rate - THREE semicircular ARC GAUGES (Today / MTD / YTD), Revenue tab, below the SILO
     revenue figures. These replaced the old flat .fliprow/.flipcard cards so the flip rate reads the
     way the SILO manager's own display does. All geometry and colour live in flipArc() (the same arc
     maths as siloGauge(), light palette); this only sizes the row, the period label and the counts
     line. Budget ~135px total per gauge - the Revenue tab is already at the 1080p limit.
     SCOPE: only the flip rate is an arc. Every GOAL PROGRESS BAR stays a straight .goalbar, including
     the flip rate's own goal bar directly below these gauges. */
  .fliparcs{display:flex; gap:10px; margin:4px 0 6px; flex-wrap:wrap;}
  .fliparc{flex:1 1 0; min-width:150px; text-align:center;}
  .fliparc .fal{font-size:.78rem; font-weight:700; letter-spacing:.05em; color:var(--brand);
     text-transform:uppercase; line-height:1.2; white-space:nowrap;}
  .fliparc svg{display:block; width:100%; max-width:215px; margin:0 auto;}
  .fliparc .fac{font-size:.72rem; font-weight:600; color:var(--dim2); line-height:1.25;
     font-variant-numeric:tabular-nums;}
  /* Revenue tab compaction - Plumbing + SILO must fit one 1080p screen, no horizontal overflow */
  .revtab{padding:12px 30px 16px;}
  .revtab .head{margin-bottom:4px;}
  .revtab h3{margin:8px 0 3px;}
  .revtab .cav{margin-top:4px; font-size:.78rem; line-height:1.3;}
  .revtab .revcav{margin:2px 0 6px; font-size:.72rem;}
  .revtab .revgrid{margin:4px 0 6px; gap:16px;}
  .revtab .revhero{padding:9px 26px 11px; border-radius:14px;}
  .revtab .revhero .rl{font-size:.88rem;}
  .revtab .revhero .rv{font-size:clamp(1.7rem,2.7vw,2.3rem); margin-top:3px;}
  .revtab .big td{font-size:1.3rem; padding:5px 14px;}
  .revtab .fliparcs{margin:4px 0 4px;}
  /* HVAC Sales (sold) + SILO (sold turnovers) sit SIDE-BY-SIDE below Plumbing (billed) so all three
     revenue streams fit one 1080p screen without clipping. Two equal columns; cards compacted to fit
     half-width. Plumbing and SILO content/logic are unchanged - only laid out in columns here. */
  .revcols{display:flex; gap:28px; align-items:flex-start; margin-top:2px;}
  .revcols > .revcol{flex:1 1 0; min-width:0;}
  .revcols > .revcol + .revcol{border-left:1px solid var(--hair); padding-left:28px;}   /* clear separation between the three streams */
  .revcols .revgrid{gap:10px; margin:4px 0 6px;}
  .revcols .revhero{min-width:140px; padding:8px 16px 10px; border-radius:12px;}
  .revcols .revhero .rl{font-size:.8rem;}
  .revcols .revhero .rv{font-size:clamp(1.3rem,1.7vw,1.6rem); font-weight:700;}
  /* The SILO column is ~590px at 1920, i.e. ~185px per gauge: tighter gap, a smaller min-width and
     smaller label/counts text so all THREE arcs sit side by side without wrapping. Same approach the
     column already takes with .revhero above. */
  .revcols .fliparcs{gap:8px; margin:4px 0 4px;}
  .revcols .fliparc{min-width:118px;}
  .revcols .fliparc .fal{font-size:.72rem;}
  .revcols .fliparc .fac{font-size:.68rem;}
  .revcols .big td{font-size:1.05rem; padding:4px 10px;}
  .revcols h3{margin:6px 0 2px;}
  .revcols .cav{font-size:.74rem;}

  /* GOAL PROGRESS BARS (backed by the Cloudflare goals Worker + KV; graceful when unconfigured).
     Compact so the 3-column Revenue tab and the fixed Overview grid stay within 1920x1080. */
  /* position:relative = the positioning context for the pace tick, which must overhang the track
     top and bottom (so it cannot live INSIDE .gtrack, which is overflow:hidden for the fill). */
  .goalbar{position:relative; margin:8px 0 2px; cursor:pointer; user-select:none;}
  .goalbar .gtrack{position:relative; height:9px; border-radius:6px; background:var(--panel2);
     border:1px solid var(--hair); overflow:hidden;}
  .goalbar .gfill{position:absolute; left:0; top:0; bottom:0; border-radius:6px;
     background:linear-gradient(90deg,var(--brand),var(--gold)); transition:width .5s ease;}
  .goalbar .gfill.over{background:linear-gradient(90deg,var(--ok),#7ad19f);}
  /* THREE children now (pct, pace badge, goal text). align-items:center (was baseline) so the
     padded badge pill can never make this row taller than its own text line - the Revenue tab is
     already at the 1080p limit, so the bar's total height must not change. .ggoal takes the slack
     and stays right-aligned, which keeps the no-badge case pixel-identical to space-between. */
  .goalbar .gmeta{display:flex; justify-content:space-between; align-items:center; gap:10px;
     margin-top:4px; font-size:.8rem; color:var(--dim); line-height:1.2; flex-wrap:nowrap;}
  .goalbar .gpct{flex:0 0 auto; font-weight:700; color:var(--brand-dark); font-variant-numeric:tabular-nums;}
  .goalbar .gpct.over{color:var(--ok);}
  /* min-width:0 + ellipsis: in the narrow .revcols columns the goal text yields rather than wrap
     (wrapping would grow the bar); the exact figures are always in the bar's title tooltip. */
  .goalbar .ggoal{flex:1 1 auto; min-width:0; text-align:right; white-space:nowrap;
     overflow:hidden; text-overflow:ellipsis; color:var(--dim2); font-variant-numeric:tabular-nums;}
  .goalbar .gedit{margin-left:6px; color:var(--brand); font-weight:600; opacity:.7;}
  .goalbar:hover .gedit{opacity:1; text-decoration:underline;}
  .goalbar.noGoal{border:1px dashed var(--hair); border-radius:8px; padding:5px 10px; text-align:center;}
  .goalbar.noGoal .gset{font-size:.8rem; font-weight:600; color:var(--dim); opacity:.75;}
  .goalbar.noGoal:hover .gset{color:var(--brand); opacity:1;}
  /* A stored goal that is out of range for its kind is an ERROR, not a bar (rule 1: fail loud).
     Red dashed box + warning glyph, so it can never be confused with a real 0%, which still draws
     a normal track and fill. Same click target as the other states (data-goalkey). */
  .goalbar.badGoal{border:1px dashed var(--err); border-radius:8px; padding:5px 10px; text-align:center;
     background:rgba(196,43,40,.06);}
  .goalbar.badGoal .gbad{font-size:.8rem; font-weight:700; color:var(--err);}
  .goalbar.badGoal:hover .gbad{text-decoration:underline;}

  /* PACE TICK - where the metric SHOULD be for the elapsed part of the year. Read from across a
     room, so: 3px wide, overhanging the 9px track ~5px top and bottom, a white halo for contrast
     against both the empty track and the gradient fill, and a triangular cap so it reads at
     distance. z-index puts it ABOVE the fill once the fill passes it. Sibling of .gtrack (not a
     child) because .gtrack is overflow:hidden and would clip the overhang. */
  .goalbar .gtick{position:absolute; top:-5px; height:19px; width:4px; margin-left:-2px; z-index:3;
     background:var(--brand-dark); border-radius:1px;
     box-shadow:0 0 0 1px rgba(255,255,255,.92), 0 0 3px rgba(0,0,0,.35);}
  .goalbar .gtick::after{content:''; position:absolute; top:0; left:50%; margin-left:-6px; width:0; height:0;
     border-left:6px solid transparent; border-right:6px solid transparent;
     border-top:8px solid var(--brand-dark); filter:drop-shadow(0 0 1px rgba(255,255,255,.92));}
  /* PACE BADGE - lives inside the .gmeta row so bar height is unchanged. Colour is never the only
     signal (colour vision + distance): the word AHEAD/BEHIND and the triangle carry the meaning.
     No border and line-height under the row's own, so the pill cannot grow the row. */
  .goalbar .gbadge{flex:0 0 auto; display:inline-block; padding:1px 7px; border-radius:999px;
     font-size:.72rem; font-weight:800; line-height:1.15; letter-spacing:.04em;
     text-transform:uppercase; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .goalbar .gbadge .garrow{margin-right:4px; font-size:.66rem;}
  .goalbar .gbadge.ahead{color:#12703c; background:rgba(31,157,85,.18);}
  .goalbar .gbadge.behind{color:#8a3c06; background:rgba(180,84,10,.18);}
  /* Neutral third state. Without it a delta that rounds to zero renders "BEHIND -0%", which reads
     as broken on a wall display rather than as the good news it actually is. */
  .goalbar .gbadge.onpace{color:var(--brand-dark); background:var(--panel2);}

  /* On the dark SILO/flip context, lighten label text for contrast. */
  .goalbar.dark .gmeta{color:#9fb2cc;} .goalbar.dark .gpct{color:#f4a522;}
  .goalbar.dark .ggoal{color:#7089ab;} .goalbar.dark .gtrack{background:rgba(255,255,255,.08); border-color:#24344f;}
  /* Dark variants: flip the tick to white-on-dark, and brighten the badge tints so they stay
     legible (and still keep the word + arrow doing the real work). */
  .goalbar.dark .gtick{background:#ffffff; box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 0 3px rgba(0,0,0,.5);}
  .goalbar.dark .gtick::after{border-top-color:#ffffff; filter:drop-shadow(0 0 1px rgba(0,0,0,.6));}
  .goalbar.dark .gbadge.ahead{color:#8ce7ae; background:rgba(31,157,85,.28);}
  .goalbar.dark .gbadge.behind{color:#ffc98a; background:rgba(244,165,34,.22);}
  .goalbar.dark .gbadge.onpace{color:#cfe0f5; background:rgba(255,255,255,.12);}
  .goalbar.dark.badGoal{background:rgba(196,43,40,.20); border-color:#e2726f;}
  .goalbar.dark.badGoal .gbad{color:#ffb5b2;}

  /* Inline goal editor — lives OUTSIDE #main so the dashboard's periodic re-render never wipes it. */
  #goalEditor{position:fixed; z-index:9998; width:250px; background:#fff; border:1px solid var(--hair);
     border-radius:12px; box-shadow:0 6px 24px rgba(8,66,122,.22); padding:14px 15px; font-size:.9rem;}
  #goalEditor .ge-title{font-weight:700; color:var(--brand-dark); font-size:.86rem; margin-bottom:9px;}
  #goalEditor .ge-label{display:block; font-size:.72rem; font-weight:700; color:var(--sub);
     text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px;}
  #goalEditor input{width:100%; padding:8px 10px; font-size:.95rem; border:1px solid var(--hair);
     border-radius:8px; margin-bottom:8px; box-sizing:border-box; color-scheme:light;}
  #goalEditor .ge-btns{display:flex; gap:8px;}
  #goalEditor .ge-btns button{flex:1; padding:8px 0; font-size:.9rem; font-weight:600; border:none;
     border-radius:8px; cursor:pointer;}
  #goalEditor #geSave{background:var(--brand); color:#fff;}
  #goalEditor #geSave:hover{background:var(--brand-dark);}
  #goalEditor #geCancel{background:var(--panel2); color:var(--sub);}
  #goalEditor .ge-msg{min-height:1.1em; margin-top:8px; font-size:.8rem; font-weight:600;}
  #goalEditor .ge-msg.err{color:var(--err);} #goalEditor .ge-msg.ok{color:var(--ok);}

  /* ---------------------------------------------------------------------------
     Background-activity frame — a subtle animated edge-glow around the whole screen,
     shown ONLY while background work is in progress (a goal being edited, or data
     being fetched/refreshed). Purely visual: a fixed, pointer-events:none overlay at
     inset:0, so it can never shift layout or add scroll/overflow. Single (light) theme
     to match the dashboard. Wall-display friendly: soft, slow, low-contrast. */
  @property --actSpin{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
  #activity-frame{ position:fixed; inset:0; z-index:9990; pointer-events:none;
     opacity:0; transition:opacity .5s ease; }
  #activity-frame.on{ opacity:1; }
  /* steady feathered base glow hugging the edges (calm brand-blue) */
  #activity-frame::after{ content:""; position:absolute; inset:0;
     box-shadow:inset 0 0 42px 4px rgba(10,102,176,.20); }
  /* moving gradient sheen: a soft light travelling slowly around the frame */
  #activity-frame::before{ content:""; position:absolute; inset:0; padding:3px;
     background:conic-gradient(from var(--actSpin),
        rgba(10,102,176,0) 0deg, rgba(244,165,34,.55) 55deg,
        rgba(10,102,176,.60) 140deg, rgba(10,102,176,0) 230deg, rgba(10,102,176,0) 360deg);
     -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
             mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
     -webkit-mask-composite:xor; mask-composite:exclude;
     filter:blur(1.5px); animation:actSpin 5.5s linear infinite; animation-play-state:paused; }
  #activity-frame.on::before{ animation-play-state:running; }
  @keyframes actSpin{ to{ --actSpin:360deg; } }
  /* Respect reduced motion: hold a steady soft glow (no travel, no pulse). */
  @media (prefers-reduced-motion: reduce){
     #activity-frame::before{ animation:none; background:none; }
     #activity-frame.on::after{ box-shadow:inset 0 0 46px 6px rgba(10,102,176,.28); }
  }

  /* ---------------------------------------------------------------------------
     FULLSCREEN FIT (F11 @ 1920x1080) — compaction so every tab fits one screen
     with no vertical scroll and no horizontal cut-off. Verified across all 9 tabs
     (Overview, Calls, Cancellations, Staffing, Pipeline, Call Board, Sources,
     Revenue, SILO) against live data. Placed LAST so equal-specificity rules here
     win the cascade tie over the base rules above; higher-specificity Revenue rules
     (.revtab / .revcols) are left intact except where re-stated below. */
  .wrap{ padding:14px 30px 16px; }
  h3{ margin:9px 0 4px; }
  .cav{ margin-top:5px; line-height:1.35; }
  .chips{ margin:4px 0 8px; }
  .cxbar{ margin:8px 0 2px; }
  .cols{ gap:36px; }
  .det td{ font-size:.9rem; padding:2px 14px; }
  .rank td{ padding:4px 10px; font-size:1rem; }
  .cal{ gap:6px; }
  .cal-cell{ min-height:88px; padding:8px 8px 9px; }
  .cal-total{ font-size:2rem; }
  .silocard{ padding:12px 16px; }
  .silolb{ margin-top:10px; padding:12px 18px 6px; }
  .silolb h3{ margin-bottom:6px; }
  .lbrow{ padding:3px 0; }
  .silocav{ margin-top:8px; }
  .revcols{ gap:20px; }
  .revcols > .revcol + .revcol{ padding-left:20px; }
  .revcols .revhero{ padding:9px 10px 11px; }
  .revcols .revhero .rv{ font-size:clamp(1.3rem,1.7vw,1.6rem); font-weight:700; white-space:nowrap; letter-spacing:-.02em; }
</style>
</head>

<script>
/* STATIC_MODE: when true, the page reads pre-generated static JSON files (data/, manifest.json,
   freshness.json) instead of hitting serve.ps1's /api/* endpoints. Set by build-static.ps1 injecting
   window.__DASH_STATIC__=true before this script. Default (unset / false) = live API mode, unchanged. */
const STATIC_MODE = (window.__DASH_STATIC__ === true);
let STATIC_MANIFEST = null;   // { dates:[...], siloMonths:[...] } from manifest.json (STATIC_MODE only)
let STATIC_TODAY = null;      // latest available date in STATIC_MODE, stands in for todayStr()
function metricsUrl(dateStr){ return STATIC_MODE ? ('data/'+dateStr+'.json') : ('/api/metrics?date='+encodeURIComponent(dateStr)); }
function siloUrl(month){ return STATIC_MODE ? ('data/silo-'+month+'.json') : ('/api/silo?month='+encodeURIComponent(month)); }
/* SILO flip-rate cache. Precomputed by refresh-silo-flip.ps1 (never computed on request) and read
   as a plain file; build-static.ps1 copies every data/*.json into site/data/, so the static path
   resolves with no manifest change. */
function flipUrl(){ return STATIC_MODE ? 'data/silo-flip.json' : '/api/silo-flip'; }
function effectiveToday(){ return STATIC_MODE ? STATIC_TODAY : todayStr(); }

const TABS = [
  {id:'overview', label:'Overview'},
  {id:'calls', label:'Calls'},
  {id:'cancellations', label:'Cancellations'},
  {id:'staffing', label:'Staffing'},
  {id:'pipeline', label:'Pipeline'},
  {id:'callboard', label:'Call Board'},
  {id:'sources', label:'Sources'},
  {id:'revenue', label:'Revenue'},
  {id:'silo', label:'SILO'},
];
/* HR & Payroll is a LINK OUT, not a panel (see renderNav). Two deliberate choices here.
 *
 * WHY ONLY IN STATIC_MODE: serve.ps1 serves dashboard.html and the two API routes and nothing
 * else, so hr.html exists only in the published build - the tab would 404 on a locally served
 * dashboard. It is deliberately NOT added to serve.ps1's routing either: that path reads files
 * with PowerShell Get-Content, which mangles the non-ASCII characters hr.html carries.
 *
 * WHY ?lock=1: this dashboard runs on a wall screen read from across a room, on an always-on
 * machine. A session left open in a browser there stays valid for 8 hours, so a plain link would
 * make salaries one click away. hr.html sees this parameter and drops any existing session before
 * anything else runs, so arriving via this tab ALWAYS demands the password.
 * rel="noopener" is a second, independent layer: it puts the new tab in its own browsing context
 * group, which stops the browser copying this tab's sessionStorage into it. Either mechanism alone
 * would do the job; neither is relied on by itself. */
if (STATIC_MODE) TABS.push({id:'hr', label:'HR & Payroll', href:'hr.html?lock=1'});
let active = 'overview';
let data = null;
let pollTimer = null;
let siloData = null, siloLoading = false, siloErr = null;   // SILO tab (monthly, separate endpoint)
let FLIP = null;   // SILO flip-rate cache envelope {asOf, final, generatedAt, block} - see loadFlip()
let cbSelDay = null;   // Call Board: day selected for the call-type breakdown (defaults to today)

const $ = id => document.getElementById(id);

/* ---- Background-activity frame (purely visual): show the animated edge-glow while work
   is in progress — a goal is being edited, or dashboard data is being fetched/refreshed.
   Ref-counted so overlapping fetches keep it lit; OR'd with the goal-editor open state. */
let __fetchBusy = 0;
function refreshActivityFrame(){
  const ed = $('goalEditor');
  const editorOpen = !!ed && ed.style.display !== 'none';
  const f = $('activity-frame');
  if(f) f.classList.toggle('on', editorOpen || __fetchBusy > 0);
}
function beginFetchActivity(){ __fetchBusy++; refreshActivityFrame(); }
function endFetchActivity(){ __fetchBusy = Math.max(0, __fetchBusy - 1); refreshActivityFrame(); }
const asArray = x => Array.isArray(x) ? x : (x==null ? [] : [x]);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (typeof n==='number' ? n.toLocaleString('en-US') : n);
function todayStr(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function agoText(iso){ if(!iso) return 'unknown'; const m=Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(m<1) return 'just now'; if(m===1) return '1 min ago'; if(m<60) return m+' min ago';
  const h=Math.floor(m/60); return h+(h===1?' hr ago':' hrs ago'); }
function stale(iso){ return !iso || (Date.now()-new Date(iso).getTime())>10*60000; }

function block(id){ if(!data) return null; return asArray(data.metrics).find(m=>m.id===id) || null; }
function rowsOf(b, ti=0){ if(!b) return []; const t=asArray(b.tables)[ti]; if(!t) return []; return asArray(t.rows).map(r=>asArray(r)); }
function sumCol(rows, i){ let s=0; rows.forEach(r=>{ if(typeof r[i]==='number') s+=r[i]; }); return s; }
function shortBU(s){ return String(s).replace(' - ',' '); }

/* ---------- GOAL PROGRESS BARS (Cloudflare Worker + KV) ----------
   GOALS_API: paste your deployed Cloudflare Worker URL here, e.g.
     const GOALS_API = 'https://sierra-goals.<your-subdomain>.workers.dev';
   Leave it EMPTY to disable the feature entirely: the dashboard then renders normally with NO
   goal bars and NO errors (fully graceful). When set, goals are fetched from {GOALS_API}/goals
   and can be edited (password-gated server-side) via {GOALS_API}/goals POST.

   Goal keys (documented) and the period each bar measures:
     plumbing-rev-ytd    Plumbing revenue, Year-To-Date (billed, pre-tax)       -> currency
     hvac-sales-ytd      HVAC Sales sold, Year-To-Date (sold/signed, pre-tax)   -> currency
     calls-booked-today  Calls booked, TODAY (all business units)               -> count
     silo-rev-ytd        SILO revenue, Year-To-Date (sold/signed, pre-tax)      -> currency
   The SILO section has exactly ONE goal bar: silo-rev-ytd (dollars, with a pace tick) under the
   revenue figures. There is deliberately NO goal bar on the flip rate: its arc gauges already
   carry a tick at the target and a signed ahead/behind delta per period, so a straight bar
   underneath was saying the same thing twice. The old silo-flip-ytd key was removed 2026-08-11 -
   see DECISIONS.md M9.4. Any value still stored under it in the Worker's KV is now ORPHANED
   (nothing reads it); it is harmless but can be deleted.
*/
const GOALS_API = 'https://sierra-goals.troy-18a.workers.dev';   // <-- paste your Cloudflare Worker URL here (see comment above)
let GOALS = {};         // key -> goal number (fetched from the Worker; empty when unconfigured)

const GOAL_META = {
  'plumbing-rev-ytd':  {label:'Plumbing revenue goal (YTD)', kind:'money',   period:'YTD'},
  'hvac-sales-ytd':    {label:'HVAC Sales sold goal (YTD)',  kind:'money',   period:'YTD'},
  'calls-booked-today':{label:'Calls booked goal (today)',   kind:'count'},
  // These labels are what the editor shows, and what goalShortName() derives the metric name from
  // for validation messages, so they must name the metric AND its unit unmistakably.
  // NOTE: no 'percent' goal key exists any more (silo-flip-ytd was removed 2026-08-11 - the flip
  // arcs carry their own target tick and delta). The percent entry in GOAL_RANGE below is still
  // required: the flip gauges reuse it to validate siloFlip.targetRate.
  'silo-rev-ytd':      {label:'SILO revenue goal (YTD)', kind:'money',   period:'YTD'},
};
/* ONE source of truth for what a goal value may be, keyed by GOAL_META.kind. Used by BOTH the
   editor (saveGoal, before the POST) and the renderer (goalBar, for a value already in the store) -
   the thresholds live here and nowhere else. The Worker (goals-worker/worker.js) holds the
   authoritative server-side copy; keep the two in sync.
   Zero and negatives are rejected for EVERY kind: goalBar() treats 0 as "no goal set" (hasGoal
   requires goal>0), so accepting a 0 would render the "+ Set goal" affordance again and look like
   the save silently did nothing - and a negative target is meaningless for all three kinds.
   money ceiling: the largest real YTD figure in this business is HVAC Sales at ~$28.5M, so $100M is
   ~3.5x headroom for growth while still catching a fat-finger extra digit on any realistic goal.
   percent: a rate goal is 0-100 by definition (an ACTUAL rate above 100% is legitimate for the flip
   metric and is never clamped - this bounds the GOAL only). count: a day's booked calls are in the
   hundreds, so 10,000 is the same kind of typo guard. */
const GOAL_RANGE = {
  money:   {max:100000000, type:'a dollar amount', range:'0 and $100,000,000', brief:'0-$100,000,000'},
  percent: {max:100,       type:'a percentage',    range:'0 and 100',          brief:'0-100'},
  count:   {max:10000,     type:'a count',         range:'0 and 10,000',       brief:'0-10,000'},
};
/* null when `n` is a valid goal for `kind`; otherwise a human-readable reason naming the type, the
   valid range and the offending value (comma-formatted, so 30000000 reads as 30,000,000). */
function goalRangeError(kind, n){
  const r = GOAL_RANGE[kind] || GOAL_RANGE.count;
  if(typeof n!=='number' || !isFinite(n)) return r.type+': enter a value between '+r.range;
  if(n<=0 || n>r.max) return r.type+': enter a value between '+r.range+
    ' (you entered '+n.toLocaleString('en-US')+')';
  return null;
}
/* Metric name for those messages: every GOAL_META label reads "<metric> goal (period)", so the text
   before " goal" is the metric ("SILO flip rate"). Falls back to the whole label. */
function goalShortName(meta){ return String((meta&&meta.label)||'Goal').split(' goal')[0] || 'Goal'; }
function goalFmt(kind, n){
  if(!isFinite(n)) return String(n);
  if(kind==='money')   return '$'+Math.round(n).toLocaleString('en-US');
  /* toLocaleString, not bare concatenation: a normal rate is unchanged (36.6 -> "36.6") but a
     bad stored goal reads as "30,000,000%" instead of an unscannable "30000000%". */
  if(kind==='percent') return (Math.round(n*10)/10).toLocaleString('en-US')+'%';
  return Math.round(n).toLocaleString('en-US');
}
/* parse "$154,018.50" -> 154018.5 ; "36.6%" -> 36.6 ; numbers pass through. NaN if unparseable. */
function parseNum(v){
  if(typeof v==='number') return v;
  if(v==null) return NaN;
  const s=String(v).replace(/[^0-9.\-]/g,'');
  return s==='' ? NaN : Number(s);
}
async function loadGoals(){
  if(!GOALS_API) return;                       // feature off -> stay graceful, no fetch, no error
  try{
    const r = await fetch(GOALS_API.replace(/\/+$/,'')+'/goals', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if(j && typeof j==='object' && !Array.isArray(j)) GOALS = j;
  }catch(e){ /* graceful: unreachable/misconfigured goals store must NOT blank or error the page */ }
}
/* ---------- PACE (how far into the year we are, for the YTD bars) ----------
   Rule 4: all day boundaries are Pacific. todayStr() reads the BROWSER clock, so a wall PC set to
   any other timezone would move the pace marker by a day - it is deliberately NOT used here.
   The snapshot already carries the backend-resolved Pacific date in data.date ("YYYY-MM-DD"), so
   this parses that string and does pure integer arithmetic: no new Date(), no Intl, no timezone
   conversion anywhere. Returns null when data.date is absent or malformed, and the callers then
   draw NO tick and NO badge rather than guessing a position (rule 1).
   Sanity: 2026-08-11 -> day 223 of 365 (frac .6110); 2026-08-10 -> day 222. */
const DOY_BEFORE = [0,31,59,90,120,151,181,212,243,273,304,334];   // days before month N in a non-leap year
const MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function paceFromDate(ds){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ds==null?'':ds));
  if(!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  if(mo<1 || mo>12 || d<1) return null;
  const leap = (y%4===0 && y%100!==0) || y%400===0;
  const dim = [31, leap?29:28, 31,30,31,30,31,31,30,31,30,31][mo-1];
  if(d>dim) return null;
  const day  = DOY_BEFORE[mo-1] + ((leap && mo>2) ? 1 : 0) + d;   // Jan 1 = day 1
  const days = leap ? 366 : 365;
  return {day:day, days:days, frac:day/days, label:MON3[mo-1]+' '+d};
}
/* AHEAD/BEHIND/ON PACE pill. The word and the triangle carry the meaning as well as the colour,
   because this is read at a distance and colour vision is not assumed.
   `state` is 'ahead' | 'behind' | 'onpace'. The neutral state exists because a delta that rounds to
   zero would otherwise render "BEHIND -0%" - which looks like a bug on a wall, not like being on
   target. On pace we show the words alone and drop the meaningless "-0". */
function goalBadge(state, text){
  const glyph = state==='ahead' ? '&#9650;' : (state==='behind' ? '&#9660;' : '&#9644;');
  const word  = state==='ahead' ? 'AHEAD'   : (state==='behind' ? 'BEHIND' : 'ON PACE');
  return `<span class="gbadge ${state}"><span class="garrow">${glyph}</span>${word}`
       + (text ? ' '+esc(text) : '') + `</span>`;
}
/* Pick the badge state from a signed delta and the ALREADY-ROUNDED magnitude that will be shown, so
   the word and the number can never disagree (e.g. "BEHIND" next to "0%"). */
function goalBadgeState(delta, shownMagnitude){
  if(Number(shownMagnitude)===0) return 'onpace';
  return delta>=0 ? 'ahead' : 'behind';
}
/* Build a compact goal bar for `key` given the metric's actual value for that period.
   Returns '' when the feature is off (GOALS_API empty) so nothing renders. When on but no goal is
   set, returns a subtle "Set goal" affordance. `opt.dark` styles for the dark SILO context. */
function goalBar(key, actual, opt){
  if(!GOALS_API) return '';
  opt = opt || {};
  const meta = GOAL_META[key] || {kind:'count', label:'Goal'};
  const darkCls = opt.dark ? ' dark' : '';
  const goal = GOALS[key];
  const hasGoal = typeof goal==='number' && isFinite(goal) && goal>0;
  if(!hasGoal){
    return `<div class="goalbar noGoal${darkCls}" data-goalkey="${esc(key)}"><span class="gset">+ Set goal</span></div>`;
  }
  /* The goal ALREADY IN THE STORE can be out of range for its kind - the SILO flip goal was saved as
     30000000 and rendered "YTD goal 30000000%" because nothing checked it. Fail loud (rule 1): show
     an actionable error INSTEAD of a bar, never a fill or a percentage computed against a nonsense
     goal. data-goalkey is kept so the delegated click handler still opens the editor.
     (0 and negatives never reach here - hasGoal above already treats them as "no goal set", which is
     exactly why saveGoal and the Worker refuse to store them.) */
  const badGoal = goalRangeError(meta.kind, goal);
  if(badGoal){
    const rng = (GOAL_RANGE[meta.kind] || GOAL_RANGE.count).brief;
    return `<div class="goalbar badGoal${darkCls}" data-goalkey="${esc(key)}" title="${esc(goalShortName(meta)+' is '+badGoal+'. Click to fix.')}"><span class="gbad">&#9888; Goal invalid: ${esc(goalFmt(meta.kind, goal))} - must be ${esc(rng)}. Click to fix.</span></div>`;
  }
  const act = parseNum(actual);
  const known = isFinite(act);
  const pct = known ? (act/goal*100) : 0;
  const fill = Math.max(0, Math.min(100, pct));          // bar capped at 100% visually
  const over = known && pct>=100;
  const pctText = known ? (Math.round(pct)+'%') : '--';   // real % (uncapped) shown as text
  const actText = known ? goalFmt(meta.kind, act) : 'n/a';
  /* ---- pace, per metric shape (deliberate: do NOT unify these three) --------------------------
     known===false -> neither tick nor badge: a pace claim needs a real actual, and a wrong one on
     the wall is worse than none.
     a) cumulative YTD totals (plumbing revenue, HVAC sales, SILO revenue; kind !== 'percent'): the
        actual grows from zero on Jan 1, so elapsed time IS the fair yardstick -> tick at the
        elapsed-year position plus an AHEAD/BEHIND badge. The track is actual/goal, so paceFrac*100%
        of the track is exactly where "on pace" sits.
     b) a percent-kind YTD goal is a RATE, not a running total. It does not accumulate from zero - it
        already sits near its level on January 2nd - so an elapsed-time pace is meaningless for it
        and would read as wildly "ahead" every December and "behind" every January. Compare the rate
        directly to the goal rate, in percentage POINTS, and draw no tick.
        NOTE: this branch is currently UNREACHABLE - no percent goal key exists since silo-flip-ytd
        was removed 2026-08-11. It is kept on purpose: it is the guardrail that stops the next
        percentage goal from being given elapsed-time pace, which is the exact mistake DECISIONS.md
        DB.6 exists to prevent. Do not "tidy" it away, and do not "fix" it into elapsed-time pace.
     c) calls-booked-today has no period (a single day's count): a year-elapsed pace says nothing
        about one day, so it gets neither a tick nor a badge. */
  let tickHtml = '', badgeHtml = '', barTitle = 'Click to edit goal';
  if(known && meta.period==='YTD' && meta.kind!=='percent'){
    const py = paceFromDate(data && data.date);           // null (missing/malformed date) -> nothing drawn
    if(py){
      const paceValue = goal * py.frac;
      const deltaPct  = (act - paceValue) / goal * 100;   // in points of the goal, same scale as the bar
      const ahead     = deltaPct >= 0;
      const shown     = Math.abs(Math.round(deltaPct));   // round FIRST, so word and number agree
      const state     = goalBadgeState(deltaPct, shown);
      tickHtml  = `<div class="gtick" style="left:${(Math.max(0,Math.min(100,py.frac*100))).toFixed(2)}%"></div>`;
      badgeHtml = goalBadge(state, state==='onpace' ? '' : ((ahead?'+':'-')+shown+'%'));
      barTitle  = 'Pace on '+py.label+': '+goalFmt(meta.kind, paceValue)+' of the '
                + goalFmt(meta.kind, goal)+' YTD goal ('+Math.round(py.frac*100)+'% of the year). Actual '
                + goalFmt(meta.kind, act)+' - '
                + (state==='onpace' ? 'on pace'
                                    : (ahead?'ahead':'behind')+' by '+goalFmt(meta.kind, Math.abs(act-paceValue)))
                + '. Click to edit goal.';
    }
  } else if(known && meta.period==='YTD' && meta.kind==='percent'){
    // Rate-vs-rate, so this needs no date at all (see (b) above): points of difference, one decimal.
    const dPts  = act - goal;
    const ahead = dPts >= 0;
    const shown = Math.abs(dPts).toFixed(1);            // round FIRST, so word and number agree
    const state = goalBadgeState(dPts, shown);
    badgeHtml = goalBadge(state, state==='onpace' ? '' : ((ahead?'+':'-')+shown+' pts'));
    barTitle  = 'Rate '+goalFmt(meta.kind, act)+' against the '+goalFmt(meta.kind, goal)+' YTD goal - '
              + (state==='onpace' ? 'on pace'
                                  : (ahead?'ahead':'behind')+' by '+shown+' percentage points')
              + '. A flip rate does not accumulate, so elapsed-time pace does not apply to it.'
              + ' Click to edit goal.';
  }
  return `<div class="goalbar${darkCls}" data-goalkey="${esc(key)}" title="${esc(barTitle)}">
    <div class="gtrack"><div class="gfill${over?' over':''}" style="width:${fill}%"></div></div>${tickHtml}
    <div class="gmeta">
      <span class="gpct${over?' over':''}">${pctText}<span class="gedit">edit</span></span>
      ${badgeHtml}
      <span class="ggoal">${esc(actText)} / ${meta.period?esc(meta.period)+' ':''}goal ${esc(goalFmt(meta.kind, goal))}</span>
    </div>
  </div>`;
}

/* ----- goal editor popover (password-gated save to the Worker) ----- */
let geKey = null;   // key currently being edited
function geMsg(text, isErr){ const el=$('geMsg'); el.textContent=text||''; el.className='ge-msg'+(text?(isErr?' err':' ok'):''); }
function openGoalEditor(key, anchor){
  geKey = key;
  const meta = GOAL_META[key] || {label:'Goal'};
  $('geTitle').textContent = meta.label;
  const cur = GOALS[key];
  $('geVal').value = (typeof cur==='number' && isFinite(cur)) ? cur.toLocaleString('en-US',{maximumFractionDigits:20}) : '';
  $('gePass').value = '';
  geMsg('');
  const ed = $('goalEditor');
  ed.style.display = 'block';
  refreshActivityFrame();
  // Position under the clicked bar, kept inside the viewport.
  const r = anchor.getBoundingClientRect();
  const w = 250, h = ed.offsetHeight || 180;
  let left = Math.min(r.left, window.innerWidth - w - 12);
  let top  = r.bottom + 8;
  if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 8);
  ed.style.left = Math.max(8,left)+'px';
  ed.style.top  = top+'px';
  $('geVal').focus(); $('geVal').select();   // value is now the top field; select so typing overwrites
}
function closeGoalEditor(){ $('goalEditor').style.display='none'; $('gePass').value=''; geKey=null; refreshActivityFrame(); }
async function saveGoal(){
  if(!geKey) return;
  if(!GOALS_API){ geMsg('goals API not configured', true); return; }
  const raw = $('geVal').value.trim();
  const val = Number(raw.replace(/,/g,''));   // accept typed commas (e.g. 10,000,000) and decimals; strip commas before saving
  if(raw==='' || !isFinite(val)){ geMsg('enter a valid number', true); return; }
  /* Type-aware range check BEFORE the POST: a percent goal typed as 30000000 (how the SILO flip goal
     came to render "YTD goal 30000000%") is rejected here with the type, the range and what they
     typed, so the fix is obvious. The Worker repeats this check authoritatively; this copy is only
     for a fast, specific message. Same thresholds - GOAL_RANGE - as the render-time check. */
  const meta = GOAL_META[geKey] || {kind:'count', label:'Goal'};
  const rangeErr = goalRangeError(meta.kind, val);
  if(rangeErr){ geMsg(goalShortName(meta)+' is '+rangeErr+'.', true); return; }
  const pass = $('gePass').value;              // kept only in this input / local var; never stored or logged
  geMsg('saving...', false);
  try{
    const r = await fetch(GOALS_API.replace(/\/+$/,'')+'/goals', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Edit-Password':pass},
      body: JSON.stringify({key:geKey, value:val}),
    });
    if(r.status===401){ geMsg('wrong password', true); return; }
    if(!r.ok){ geMsg('save failed (HTTP '+r.status+')', true); return; }
    const j = await r.json();
    if(j && typeof j==='object' && !Array.isArray(j)) GOALS = j;
    closeGoalEditor();
    renderActive();                            // reflect the new goal live
  }catch(e){ geMsg('network error - could not reach goals server', true); }
}

/* ---------- OVERVIEW (fixed, no scroll) ---------- */
function tile(label, inner, b, caveat){
  const err = !b || b.status==='error';
  const pulled = b ? `pulled ${agoText(b.pulledAt)}` : '';
  return `<div class="tile ${err?'err':''}">
    <div class="tpulled ${b&&stale(b.pulledAt)?'stale':''}">${pulled}</div>
    <div class="tlabel">${esc(label)}</div>
    ${err ? `<div class="tnum">unavailable</div>` : inner}
    ${(!err && caveat) ? `<div class="tcav">${esc(caveat)}</div>` : ''}
  </div>`;
}
function renderOverview(){
  const prog = data && data.isToday;
  let h = '';
  // Calls: BOOKED is the hero; completed is secondary (and "so far" when today)
  const cc = block('call-counts'); const ccr = rowsOf(cc);
  h += tile('Calls booked',
    `<div class="tnum num">${fmt(sumCol(ccr,1))}</div>
     <div class="tsub"><b class="num">${fmt(sumCol(ccr,2))}</b> completed${prog?' <span class="q">so far</span>':''}</div>
     ${goalBar('calls-booked-today', sumCol(ccr,1))}`, cc);
  // Cancellations
  const cx = block('cancellations'); const cxr = rowsOf(cx,0);
  h += tile('Cancellations', `<div class="tnum num">${fmt(sumCol(cxr,1))}</div>
     <div class="tsub q">scheduled for this day</div>`, cx);
  // Calls per tech (service): two ratios
  const cpt = block('calls-per-tech'); const cptr = rowsOf(cpt);
  const dual = cptr.map(r=>`<div><div class="u">${esc(shortBU(r[0]))}</div><div class="v num">${esc(r[3])}</div></div>`).join('');
  h += tile('Calls per tech', `<div class="dual">${dual||'<div class="tnum">-</div>'}</div>
     <div class="tsub q">service only</div>`, cpt, prog?'INCOMPLETE - day still in progress; only meaningful once the day is done':null);
  // Overtime: all-hours hero + job-only secondary; incomplete-payroll warnings badge on top if present
  const ot = block('overtime'); const otr = rowsOf(ot);
  const otJobRows = rowsOf(ot,1);
  const otJobOnly = otJobRows.find(r=>String(r[0]).includes('on jobs only'));
  const otWarnBadge = (ot && ot.status!=='error' && asArray(ot.warnings).length)
    ? `<div class="otwarn small">${esc(asArray(ot.warnings).map(w=>w.message).join(' '))}</div>` : '';
  h += tile('Overtime hours', `<div class="tnum num">${fmt(Math.round(sumCol(otr,3)*10)/10)}</div>
     <div class="tsub q">all hours${otJobOnly?` &middot; <b class="num">${fmt(otJobOnly[3])}</b> on jobs (incl. travel)`:''}</div>${otWarnBadge}`, ot, 'All hours includes idle / driving / training. On jobs = time tied to a job, including travel to and from it.');
  // Maintenances 14d
  const mt = block('maint-14d'); const mtr = rowsOf(mt,0);
  h += tile('Maintenances booked', `<div class="tnum num">${fmt(sumCol(mtr,1))}</div>
     <div class="tsub q">next 14 days</div>`, mt, 'as of now, not the selected day');
  // Members to run
  const cm = block('club-members'); const cmr = rowsOf(cm);
  const leftRow = cmr.find(r=>String(r[0]).toUpperCase().startsWith('LEFT'));
  const leftNum = leftRow ? String(leftRow[1]).split(' ')[0] : '-';
  const leftPct = leftRow ? ((String(leftRow[1]).match(/\(([^)]+)\)/)||['',''])[1]) : '';
  h += tile('Members to run', `<div class="tnum num">${esc(leftNum)}</div>
     <div class="tsub q">${esc(leftPct)} of club, cooling</div>`, cm, 'no cooling visit in 16 months');
  return h;
}

/* ---------- generic table (no caps) ---------- */
function tableFromObj(t, cls){
  if(!t) return '';
  const cols = asArray(t.columns); const rows = asArray(t.rows).map(r=>asArray(r));
  const det = (cls||'').includes('det');
  let h = `<div class="${cls||''}"><table><thead><tr>`;
  cols.forEach((c,i)=> h += `<th class="${i>0 && !det?'r':''}">${esc(c)}</th>`);
  h += '</tr></thead><tbody>';
  if(rows.length===0) h += `<tr><td colspan="${cols.length}" style="color:var(--dim)">none</td></tr>`;
  rows.forEach(r=>{ h+='<tr>'; r.forEach((c,i)=>{
    const right = typeof c==='number' && i>0 && !det;
    const quiet = det && i>=4 ? ' q' : '';
    h += `<td class="${right?'r':''}${quiet}">${esc(fmt(c))}</td>`;
  }); h+='</tr>'; });
  h += '</tbody>';
  if(t.footer) h += `<tfoot><tr><td colspan="${cols.length}">${esc(t.footer)}</td></tr></tfoot>`;
  h += '</table></div>';
  return h;
}
function tableHtml(b, ti, cls){ return tableFromObj(asArray(b.tables)[ti], cls); }
/* two-column split of a single table's rows (same header repeated in each column) - used only
   for booking-source, which has grown too tall for one column at 1080p. Row count/split point is
   computed from t.rows.length so it stays correct as sources are added/removed upstream. */
function tableFromObjSplit(t, cls){
  if(!t) return '';
  const rows = asArray(t.rows).map(r=>asArray(r));
  if(rows.length===0) return tableFromObj(t, cls);
  const mid = Math.ceil(rows.length/2);
  const left = { columns:t.columns, rows:rows.slice(0,mid) };
  const right = { columns:t.columns, rows:rows.slice(mid), footer:t.footer };
  // footer (if any) belongs with the full set - keep it on the right/last column only
  return `<div class="cols"><div class="col">${tableFromObj(left,cls)}</div><div class="col">${tableFromObj(right,cls)}</div></div>`;
}
function notesHtml(b){ return asArray(b&&b.notes).map(n=>{ const w=/AVOCA|CAVEAT|INCOMPLETE/i.test(n); return `<div class="cav"${w?' style="color:var(--warn)"':''}>${esc(n)}</div>`; }).join(''); }
/* Collapsible "How this is calculated" wrapper for the Revenue-tab notes. Closed by default.
   Open state is tracked in OPEN_NOTES (keyed by block id) so it SURVIVES the 30s auto-re-render
   (renderActive rebuilds the HTML each tick and reads this set to restore the open panels). */
const OPEN_NOTES = new Set();
function collapsibleNotes(id, b, label){
  const inner = notesHtml(b);
  if(!inner) return '';                        // no notes -> render nothing (stay graceful)
  const open = OPEN_NOTES.has(id);
  // `label` is optional and defaults to the original text. It exists because the SILO column now
  // stacks TWO of these (revenue + flip, separate blocks with separate notes) and two identically
  // labelled toggles side by side give the reader no way to tell which is which.
  return `<div class="revnotes${open?' open':''}" data-notekey="${esc(id)}">`
       +   `<button type="button" class="revnotes-toggle" aria-expanded="${open?'true':'false'}">${esc(label || 'How this is calculated')}</button>`
       +   `<div class="revnotes-body">${inner}</div>`
       + `</div>`;
}
function errBlock(b,title){
  // Show the REAL error, not a generic placeholder: if the block came back with status='error',
  // display its actual b.error string. If the block is ABSENT entirely (server didn't return this
  // id at all - typically an old server process running pre-metric code), say so explicitly rather
  // than "unknown error", which told users nothing actionable.
  let msg;
  if (b && b.status==='error') { msg = b.error || '(server did not include an error message)'; }
  else if (!b) { msg = "This metric wasn't returned by the server - the server may be running older code. Restart the dashboard server."; }
  else { msg = 'unknown error'; }
  return `<div class="head"><h2>${esc(title)}</h2></div><div class="banner show">COULD NOT LOAD - ${esc(msg)}</div>`;
}

/* two-week maintenance calendar; empty days render as dashed holes */
function calGrid(rows, footLabel, weekendAware, selDay){
  // Call Board rows are [date, HVAC, ROPPS, Plumbing, Total, Techs] (6 cols); the maintenance
  // calendar still uses the 5-col [date, HVAC, Plumbing, Total, Techs] shape. Detect by length.
  const threeCat = rows.length>0 && rows[0].length>=6;
  const cells = rows.map(r=> threeCat
    ? ({ date:String(r[0]),
         hvac:(typeof r[1]==='number'?r[1]:0), ropps:(typeof r[2]==='number'?r[2]:0),
         plmb:(typeof r[3]==='number'?r[3]:0), total:(typeof r[4]==='number'?r[4]:0),
         foot:(footLabel && r.length>5)? r[5] : null, three:true })
    : ({ date:String(r[0]),
         hvac:(typeof r[1]==='number'?r[1]:0), plmb:(typeof r[2]==='number'?r[2]:0),
         total:(typeof r[3]==='number'?r[3]:0), foot:(footLabel && r.length>4)? r[4] : null, three:false }));
  if(cells.length===0) return '<div class="cav">none</div>';
  const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const first = new Date(cells[0].date+'T00:00:00');
  const lead = first.getDay();
  let h = '<div class="cal">';
  WD.forEach(d=> h += `<div class="cal-wd">${d}</div>`);
  for(let i=0;i<lead;i++) h += '<div class="cal-cell blank"></div>';
  const pickable = (selDay!==undefined);
  cells.forEach(c=>{
    const dt = new Date(c.date+'T00:00:00');
    const dow = dt.getDay();
    const isWeekend = !!weekendAware && (dow===0 || dow===6);
    const lbl = dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const foot = (c.foot!=null) ? `<div class="cal-foot">${esc(footLabel)} ${esc(String(c.foot))}</div>` : '';
    // when the grid is day-selectable (Call Board), tag each cell so a click picks the day for the
    // type breakdown below; the maintenance calendar (no selDay) is unaffected.
    const pk = pickable ? ` data-cbday="${esc(c.date)}"` : '';
    const selCls = (pickable && c.date===selDay) ? ' sel' : '';
    const split = c.three
      ? `<div class="cal-split three"><span>H <b>${c.hvac}</b></span><span>R <b>${c.ropps}</b></span><span>P <b>${c.plmb}</b></span></div>`
      : `<div class="cal-split"><span>H <b>${c.hvac}</b></span><span>P <b>${c.plmb}</b></span></div>`;
    if(isWeekend){
      // weekends are non-budgeted, not a "hole" - always show the muted/neutral treatment,
      // even when total is 0, so light weekend volume never reads as a gap to fill.
      h += `<div class="cal-cell weekend${selCls}"${pk}><div class="cal-date">${esc(lbl)}</div>`+
           `<div class="cal-total num">${c.total}</div>`+split+
           `<div class="cal-wknd-tag">non-budgeted</div>${foot}</div>`;
    } else if(c.total===0){
      h += `<div class="cal-cell hole${selCls}"${pk}><div class="cal-date">${esc(lbl)}</div><div class="cal-hole">-</div>${foot}</div>`;
    } else {
      h += `<div class="cal-cell${selCls}"${pk}><div class="cal-date">${esc(lbl)}</div>`+
           `<div class="cal-total num">${c.total}</div>`+split+`${foot}</div>`;
    }
  });

/* ---------- Cancellations: filter state (persists across re-renders; resets per day) ---------- */
/* detail row layout: 0 Business Unit | 1 Job Type | 2 Scheduled | 3 Cancelled | 4 Reason | 5 By */
const CX_DIMS = {bu:0, jobType:1, reason:4, by:5};   // categorical dims -> detail column
let cxFilter = null;
function cxEmpty(date){ return {date, bu:[], jobType:[], reason:[], by:[], timing:[]}; }
function cxEnsure(){ if(!cxFilter || cxFilter.date!==data.date) cxFilter = cxEmpty(data.date); }
function cxCount(){ return cxFilter ? cxFilter.bu.length+cxFilter.jobType.length+cxFilter.reason.length+cxFilter.by.length+cxFilter.timing.length : 0; }
function cxToggle(dim,val){ cxEnsure(); const a=cxFilter[dim]; if(!a) return; const i=a.indexOf(val); if(i>=0)a.splice(i,1); else a.push(val); renderActive(); }
function cxClearAll(){ if(data){ cxFilter=cxEmpty(data.date); renderActive(); } }
function cxTiming(sched, canc){
  if(!canc || !/^\d{4}-\d{2}-\d{2}/.test(String(canc))) return null;      // no cancel-log -> unknown timing
  const sd=String(sched).slice(0,10), cd=String(canc).slice(0,10);
  const days=Math.round((Date.parse(sd+'T00:00:00')-Date.parse(cd+'T00:00:00'))/86400000);
  return days>0 ? {bucket:'ahead', label:days+'d ahead'} : {bucket:'same-day', label:'same day'};
}
function cxMatch(r){
  const f=cxFilter; if(!f) return true;
  for(const d in CX_DIMS){ if(f[d].length && !f[d].includes(String(r[CX_DIMS[d]]))) return false; }
  if(f.timing.length){ const t=cxTiming(r[2],r[3]); if(!t || !f.timing.includes(t.bucket)) return false; }
  return true;
}
function cxRank(rows, idx){
  const m=new Map(); rows.forEach(r=>{ const k=String(r[idx]||'—'); m.set(k,(m.get(k)||0)+1); });
  return [...m.entries()].sort((a,b)=> b[1]-a[1] || String(a[0]).localeCompare(String(b[0])));
}
function rankTable(pairs, dim, cap){
  if(!pairs.length) return '<div class="hint">none</div>';
  const max=pairs[0][1]; const shown=pairs.slice(0,cap);
  let h='<table class="rank"><tbody>';
  shown.forEach(([k,c])=>{
    const on=(cxFilter && cxFilter[dim].includes(k))?'on':'';
    const disp = dim==='bu' ? shortBU(k) : k;
    h+=`<tr class="${on}" data-cxdim="${dim}" data-cxval="${esc(k)}"><td class="nm">${esc(disp)}</td>`+
       `<td class="barcell"><div class="bar" style="width:${Math.max(4,Math.round(100*c/max))}%"></div></td>`+
       `<td class="ct num">${c}</td></tr>`;
  });
  if(pairs.length>cap) h+=`<tr class="more"><td colspan="3">+${pairs.length-cap} more (click a cell below to filter)</td></tr>`;
  h+='</tbody></table>'; return h;
}
function cxActiveChips(){
  const lbl={bu:'Unit', jobType:'Type', reason:'Reason', by:'CSR', timing:'Timing'};
  let out=[];
  ['bu','jobType','reason','by','timing'].forEach(d=> cxFilter[d].forEach(v=>{
    const disp = d==='bu'?shortBU(v):(d==='timing'?(v==='ahead'?'days ahead':'same-day'):v);
    out.push(`<span class="cxtag on" data-cxdim="${d}" data-cxval="${esc(v)}">${esc(lbl[d])}: ${esc(disp)} <span class="x">✕</span></span>`);
  }));
  return out.join('');
}
function cxDetail(rows){
  const cols=['Business Unit','Job Type','Scheduled','Cancelled','Reason','By','Timing'];
  const shown=rows.filter(cxMatch);
  let h='<table><thead><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr></thead><tbody>';
  if(!shown.length) h+=`<tr><td colspan="${cols.length}" style="color:var(--dim)">no cancellations match the current filters</td></tr>`;
  const cell=(v,dim,q)=>`<td class="cxcell${q?' q':''}" data-cxdim="${dim}" data-cxval="${esc(String(v))}">${esc(fmt(v))}</td>`;
  shown.forEach(r=>{
    const t=cxTiming(r[2],r[3]);
    h+='<tr>'+cell(r[0],'bu')+cell(r[1],'jobType')+
       `<td>${esc(r[2])}</td><td class="q">${esc(r[3])}</td>`+
       cell(r[4],'reason',1)+cell(r[5],'by',1)+
       (t?`<td class="cxcell q" data-cxdim="timing" data-cxval="${t.bucket}">${esc(t.label)}</td>`:`<td class="q">—</td>`)+
       '</tr>';
  });
  h+='</tbody></table>';
  return {html:h, shown:shown.length, total:rows.length};
}

function callBoardDetail(cb, selDay){

  // (broad total + its 5 business-unit sub-rows), then SILO/ROPPS, then Plumbing. Opportunities are
  // the emphasized column; non-opportunities are shown but muted (they are excluded from the headline).
  const rows = rowsOf(cb,1).filter(r=>String(r[0])===selDay);
  if(rows.length===0) return '';
  const num=v=>(typeof v==='number'?v:0);
  const dt = new Date(selDay+'T00:00:00');
  const lbl = dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const hvac = rows.filter(r=>String(r[1]).startsWith('HVAC:'));
  const ropps = rows.find(r=>String(r[1])==='ROPPS');
  const plmb  = rows.find(r=>String(r[1])==='PLMB');
  const hO = hvac.reduce((s,r)=>s+num(r[3]),0), hN = hvac.reduce((s,r)=>s+num(r[4]),0);
  const grpRow=(label,o,n)=>`<tr class="grp"><td class="bk">${esc(label)}</td><td class="r opp">${o}</td><td class="r non${n===0?' z':''}">${n}</td><td class="r tot">${o+n}</td></tr>`;
  let body = grpRow('HVAC (broad)', hO, hN);
  hvac.forEach(r=>{ const o=num(r[3]), n=num(r[4]);
    body+=`<tr class="sub"><td class="bk">${esc(String(r[2]))}</td><td class="r opp">${o}</td><td class="r non${n===0?' z':''}">${n}</td><td class="r tot">${o+n}</td></tr>`; });
  if(ropps) body+=grpRow(String(ropps[2]), num(ropps[3]), num(ropps[4]));
  if(plmb)  body+=grpRow(String(plmb[2]),  num(plmb[3]),  num(plmb[4]));
  return `<div class="cbtypes"><h3>Breakdown for ${esc(lbl)} <span style="color:var(--dim);font-weight:500">- opportunities vs non-opportunities. Click any day above to change.</span></h3>`+
    `<table class="cbtype"><thead><tr><th>Bucket</th><th class="r">Opportunities</th><th class="r">Non-opp</th><th class="r">Total</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
// Call Board 14-day calendar. Rows: [Date, HVAC_opp, HVAC_non, ROPPS_opp, ROPPS_non, PLMB_opp, PLMB_non, Techs].
// Each cell shows the three bucket OPPORTUNITY counts big, a muted "+N non-opp" tag under HVAC, and techs.
function callBoardGrid(rows, selDay){
  const cells = rows.map(r=>({
    date:String(r[0]),
    hvO:(typeof r[1]==='number'?r[1]:0), hvN:(typeof r[2]==='number'?r[2]:0),
    rpO:(typeof r[3]==='number'?r[3]:0), rpN:(typeof r[4]==='number'?r[4]:0),
    plO:(typeof r[5]==='number'?r[5]:0), plN:(typeof r[6]==='number'?r[6]:0),
    techs:(typeof r[7]==='number'?r[7]:0)
  }));
  if(cells.length===0) return '<div class="cav">none</div>';
  const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const first=new Date(cells[0].date+'T00:00:00'); const lead=first.getDay();
  let h='<div class="cal">';
  WD.forEach(d=>h+=`<div class="cal-wd">${d}</div>`);
  for(let i=0;i<lead;i++) h+='<div class="cal-cell blank"></div>';
  cells.forEach(c=>{
    const dt=new Date(c.date+'T00:00:00'); const dow=dt.getDay();
    const isWeekend=(dow===0||dow===6);
    const lbl=dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const oppTot=c.hvO+c.rpO+c.plO;
    const allTot=oppTot+c.hvN+c.rpN+c.plN;
    const pk=` data-cbday="${esc(c.date)}"`;
    const selCls=(c.date===selDay)?' sel':'';
    const foot=`<div class="cal-foot">techs ${c.techs}</div>`;
    const split=`<div class="cal-split three"><span>H <b>${c.hvO}</b></span><span>R <b>${c.rpO}</b></span><span>P <b>${c.plO}</b></span></div>`;
    const nonTag=c.hvN>0 ? `<div class="cal-nonopp">+${c.hvN} non-opp</div>` : '';
    if(isWeekend){
      h+=`<div class="cal-cell weekend${selCls}"${pk}><div class="cal-date">${esc(lbl)}</div>`+
         `<div class="cal-total num">${oppTot}</div>`+split+nonTag+
         `<div class="cal-wknd-tag">non-budgeted</div>${foot}</div>`;
    } else if(allTot===0){
      h+=`<div class="cal-cell hole${selCls}"${pk}><div class="cal-date">${esc(lbl)}</div><div class="cal-hole">-</div>${foot}</div>`;
    } else {
      h+=`<div class="cal-cell${selCls}"${pk}><div class="cal-date">${esc(lbl)}</div>`+
         `<div class="cal-total num">${oppTot}</div>`+split+nonTag+foot+`</div>`;
    }
  });
  const trail=(7-((lead+cells.length)%7))%7;
  for(let i=0;i<trail;i++) h+='<div class="cal-cell blank"></div>';
  h+='</div>'; return h;
}

/* ---------- SILO flip rate (precomputed cache; Revenue tab) ----------
   Reads data/silo-flip.json (static) or /api/silo-flip (live). The figure is NEVER computed on
   request - it is ~5-6 min of throttled Reporting API POSTs, so refresh-silo-flip.ps1 produces the
   cache and this just reads it (SILO-FLIP-HANDOFF.md 7.3).
   A failure here must NOT break the rest of the page: we swallow the throw and leave FLIP holding
   an error-shaped block, so renderSiloRevenueSection() fails loud in place of the cards only
   (CLAUDE.md rule 1 - never a stale or invented number, and a real 0% must look different). */
async function loadFlip(){
  try{
    const r = await fetch(flipUrl(), {cache:'no-store'});
    if(!r.ok){ let m='HTTP '+r.status; try{const j=await r.json(); if(j&&j.error)m=j.error;}catch(e){} throw new Error(m); }
    const j = await r.json();
    if(!j || !j.block) throw new Error('the flip cache returned no block - run refresh-silo-flip.ps1');
    FLIP = j;
  }catch(e){
    FLIP = {asOf:null, final:false, generatedAt:null, block:{
      id:'silo-flip', title:'SILO flip rate (TGLs created / ROPP calls ran)', status:'error',
      error:'Could not load the SILO flip cache ('+flipUrl()+'): '+((e&&e.message)||String(e))+'. Run refresh-silo-flip.ps1 to rebuild it.',
      notes:[], tables:[]}};
  }
}

function siloTier(rate){ return rate>=60 ? '#2E78C7' : (rate>=48 ? '#f4a522' : '#e0584f'); }
function siloGauge(rate){
  const R=90, cx=110, cy=112;
  const pt = f => { const a=Math.PI*(1-Math.max(0,Math.min(1,f))); return [cx+R*Math.cos(a), cy-R*Math.sin(a)]; };
  const arc = (f0,f1) => { const [x0,y0]=pt(f0), [x1,y1]=pt(f1); return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
  const col=siloTier(rate), frac=Math.max(0,Math.min(1,rate/100));

    <path d="${arc(0,.48)}"  fill="none" stroke="rgba(224,88,79,.28)"  stroke-width="16"/>
    <path d="${arc(.48,.60)}" fill="none" stroke="rgba(244,165,34,.30)" stroke-width="16"/>
    <path d="${arc(.60,1)}"  fill="none" stroke="rgba(46,120,199,.30)" stroke-width="16"/>
    <path d="${arc(0,1)}"    fill="none" stroke="#22304d" stroke-width="16" stroke-linecap="round"/>

  </svg>`;
}

function currencyTable(t){

  if(rows.length===0) h += `<tr><td colspan="${cols.length}" style="color:var(--dim)">none</td></tr>`;

  if(t.footer) h += `<tfoot><tr><td colspan="${cols.length}">${esc(t.footer)}</td></tr></tfoot>`;
