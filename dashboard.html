/* ---- SILO flip-rate ARC GAUGE (Revenue tab, LIGHT palette) -----------------------------------
   One semicircular gauge per period, matching the SILO manager's own display.
   The arc maths is siloGauge()'s, unchanged: angle = PI*(1-f), x = cx + R*cos(a), y = cy - R*sin(a),
   drawn as one `A R R 0 0 1` sweep. pt() takes an OPTIONAL radius so the target tick can be a radial
   line at the same angle - no new geometry was invented for it. siloGauge()/siloTier() themselves are
   deliberately untouched: they are the DARK SILO tab's gauge and keep their own palette and sizing.
   `p` is the cache's period object {num, den, rate}; `rate` is null when no calls have run yet.
   The FILL fraction is clamped to 0..1 (rates above 100% are real for this metric - handoff 8.4 - and
   must not draw an invalid arc), but the NUMBER printed is always the true, uncapped rate.
   `target` is passed in from the cache (config.json siloFlip.targetRate); this function never has a
   default for it. Colour is never the only signal: the delta carries a triangle glyph and a sign too.
   Colours are existing vars only: track var(--panel2) over a var(--hair) hairline (mirroring
   .gtrack's background + 1px border), fill var(--brand) at/above target and var(--gold) below it,
   number var(--brand)/var(--warn), target tick var(--dim2), counts var(--dim2) (from CSS). */
function flipArc(label, p, counts, target, title){
  const R=80, cx=100, cy=94, SW=13;
  const pt = (f,r) => { const rr=(r===undefined?R:r), a=Math.PI*(1-Math.max(0,Math.min(1,f))); return [cx+rr*Math.cos(a), cy-rr*Math.sin(a)]; };
  const arc = (f0,f1) => { const [x0,y0]=pt(f0), [x1,y1]=pt(f1); return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
  // Colours go in style="" rather than in the stroke/fill presentation attributes: var() is reliably
  // honoured in an inline style, not in every browser's presentation-attribute parsing.
  const track = `<path d="${arc(0,1)}" fill="none" stroke-width="${SW+2}" stroke-linecap="round" style="stroke:var(--hair)"/>`
              + `<path d="${arc(0,1)}" fill="none" stroke-width="${SW}" stroke-linecap="round" style="stroke:var(--panel2)"/>`;
  const den  = parseNum(p && p.den);
  const rate = (p && p.rate!=null) ? parseNum(p.rate) : NaN;
  const live = isFinite(den) && den>0 && isFinite(rate);
  if(!live){
    /* NO CALLS HAVE RUN YET (den 0 / rate null) - every morning until the first ROPP call completes.
       Track only: no fill, no target tick, an em dash instead of a number and "no calls yet" instead
       of the counts. This must NEVER read 0.0% or NaN. A genuine 0% (calls ran, no TGLs) is visibly
       different: it draws a real gauge WITH its target tick, a 0.0% number and its real counts. */
    return `<div class="fliparc" title="${esc(title)}"><div class="fal">${esc(label)}</div>`
      + `<svg viewBox="0 0 200 103" role="img" aria-label="${esc(label+': no calls have run yet')}">${track}`
      +   `<text x="100" y="80" text-anchor="middle" font-size="34" font-weight="700" style="font-family:'Poppins',sans-serif; fill:var(--dim2)">&mdash;</text>`
      + `</svg>`
      + `<div class="fac">no calls yet</div></div>`;
  }
  const hit  = rate >= target;
  /* Below target the ARC is var(--gold) but the NUMBER is var(--warn): var(--warn) is a dark brown -
     right for text, muddy as a 13px stroke - and var(--gold) is the reverse (near-illegible as text on
     white). Both are existing palette vars; nothing new was introduced. */
  const stroke = hit ? 'var(--brand)' : 'var(--gold)';
  const numCol = hit ? 'var(--brand)' : 'var(--warn)';
  const frac = Math.max(0, Math.min(1, rate/100));       // FILL clamped 0..1; the printed number is not
  const tf   = Math.max(0, Math.min(1, target/100));     // target tick, same scale as the fill
  const [tx0,ty0] = pt(tf, R-(SW/2)-2.5), [tx1,ty1] = pt(tf, R+(SW/2)+2.5);
  const d     = rate - target;
  const shown = Math.abs(d).toFixed(1);                  // round FIRST so glyph, sign and number agree
  const flat  = Number(shown)===0;                       // "-0.0 pts" would read as a bug on a wall
  const glyph = flat ? '&#9644;' : (d>=0 ? '&#9650;' : '&#9660;');
  const dText = flat ? 'on target' : ((d>=0?'+':'-')+shown+' pts');
  // Tick is drawn AFTER the fill so it stays visible once the fill passes it (same intent as .gtick's z-index).
  return `<div class="fliparc" title="${esc(title)}"><div class="fal">${esc(label)}</div>`
    + `<svg viewBox="0 0 200 103" role="img" aria-label="${esc(label+': '+rate.toFixed(1)+'% flip rate, '+counts+' TGLs / calls ran')}">${track}`
    +   `<path d="${arc(0,frac)}" fill="none" stroke-width="${SW}" stroke-linecap="round" style="stroke:${stroke}"/>`
    +   `<line x1="${tx0.toFixed(1)}" y1="${ty0.toFixed(1)}" x2="${tx1.toFixed(1)}" y2="${ty1.toFixed(1)}" stroke-width="2.5" style="stroke:var(--dim2)"/>`
    +   `<text x="100" y="76" text-anchor="middle" font-size="31" font-weight="700" style="font-family:'Poppins',sans-serif; font-variant-numeric:tabular-nums; fill:${numCol}">${rate.toFixed(1)}%</text>`
    +   `<text x="100" y="93" text-anchor="middle" font-size="12" font-weight="700" style="font-family:'Poppins',sans-serif; fill:${numCol}">${glyph} ${esc(dText)}</text>`
    + `</svg>`
    + `<div class="fac">${esc(counts)} TGLs / calls ran</div></div>`;
}
/* Flip rate, read from the PRECOMPUTED cache (FLIP) - not from the metrics snapshot, whose old
   "turnovers sold / total turnovers" flip table has been removed. Contract: FLIP.block.tables[0] has
   exactly THREE rows, today then MTD then YTD (Period | Flip Rate | TGLs / calls ran), plus a footer
   with the as-of text; FLIP.block.periods.{today,mtd,ytd} carry the raw unrounded rate (null when den
   is 0); FLIP.block.target is the target rate from config.json.
   Rendered as three arc gauges in that same order, so they line up with the Today/MTD/YTD revenue
   figures above them in this column. Rates ABOVE 100% are legitimate for this metric (handoff 8.4):
   the arc FILL is clamped, the number never is.
   The goal bar below the gauges is unchanged - a straight bar with its AHEAD/BEHIND badge. */
function renderSiloFlipCards(){
  const fb = FLIP && FLIP.block;
  // Fail loud, and in THIS order - every guard below runs before any arc maths, so a bad cache can
  // never draw a partial or invented gauge.
  // 1) no cache, or the refresh script recorded an error -> project-standard error banner in place of
  //    the gauges, so a genuine 0% can never be confused with a failure.
  if(!fb || fb.status!=='ok'){ return errBlock(fb, 'SILO flip rate'); }
  const t  = asArray(fb.tables)[0];
  const fr = asArray(t && t.rows).map(r=>asArray(r));
  if(!fr.length){ return errBlock({status:'error', error:'the flip cache has no rows - run refresh-silo-flip.ps1'}, 'SILO flip rate'); }
  // 2) the target is a BUSINESS THRESHOLD. It comes from config.json (siloFlip.targetRate) through the
  //    cache; hard rule 2 says never bake one into code, so a missing or out-of-range target is an
  //    ERROR, not a default. A silently assumed target would repaint every gauge's colour and its
  //    delta with a made-up number. Validity is judged by goalRangeError('percent', ...) - the same
  //    check the goal bars use, so there is one definition of "a usable percentage" on this page.
  const target = parseNum(fb.target);
  if(goalRangeError('percent', target)){
    return errBlock({status:'error', error:'the flip cache carries an unusable target rate (got '
      + String(fb.target===undefined ? 'nothing' : JSON.stringify(fb.target))
      + ') - it must be a percentage between ' + GOAL_RANGE.percent.range
      + '. The gauges are drawn against config.json siloFlip.targetRate and this dashboard will not guess a target. Fix it in config.json and re-run refresh-silo-flip.ps1.'}, 'SILO flip rate');
  }
  // 3) exactly three period rows (today, MTD, YTD). Fewer means the cache was written by an older
  //    refresh-silo-flip.ps1 - say so instead of drawing a partial set of gauges.
  if(fr.length<3){
    return errBlock({status:'error', error:'the flip cache has '+fr.length+' period row'+(fr.length===1?'':'s')
      + ', expected 3 (today, month to date, year to date) - it was written by an older refresh-silo-flip.ps1. Re-run it to rebuild the cache.'}, 'SILO flip rate');
  }
  // 4) the gauges are drawn from the MACHINE-READABLE periods (raw unrounded rates), never from the
  //    formatted strings, so those must be present and self-consistent. A missing rate is only valid
  //    when den is 0 (no calls yet) - that is the em-dash state below, not an error.
  const keys = ['today','mtd','ytd'], per = (fb.periods || {}), bad = [];
  keys.forEach(k=>{
    const p = per[k];
    if(!p || typeof p!=='object'){ bad.push(k+' (missing)'); return; }
    if(!isFinite(parseNum(p.num))){ bad.push(k+' (no TGL count)'); return; }
    const den = parseNum(p.den);
    if(!isFinite(den)){ bad.push(k+' (no calls-ran count)'); return; }
    if(den>0 && !(p.rate!=null && isFinite(parseNum(p.rate)))) bad.push(k+' (no rate despite '+fmt(den)+' calls)');
  });
  if(bad.length){
    return errBlock({status:'error', error:'the flip cache periods are unusable: '+bad.join(', ')
      + '. Expected periods.today, periods.mtd and periods.ytd, each with num, den and rate (rate null only when den is 0). Re-run refresh-silo-flip.ps1.'}, 'SILO flip rate');
  }
  /* SHORT labels above the arcs (Today / MTD / YTD) instead of the row's own long period text: at
     ~185px per gauge "Month to date (Aug 1 - Aug 11)" needs three lines and blows the height budget.
     The order is contract-fixed (today, MTD, YTD), and the row's full text is kept verbatim in each
     gauge's hover title, so no date range is lost. */
  const short = ['Today','MTD','YTD'];
  const gauges = keys.map((k,i)=>{
    const r = fr[i] || [], p = per[k];
    const den  = parseNum(p.den);
    const rate = (p.rate!=null) ? parseNum(p.rate) : NaN;
    const live = isFinite(den) && den>0 && isFinite(rate);
    // Counts come from the row's third column ("17 / 21"); fall back to the same numbers off the
    // period object if that cell is blank, so the line can never render as bare " TGLs / calls ran".
    const cell = (r[2]==null) ? '' : String(r[2]).trim();
    const counts = cell || (fmt(parseNum(p.num))+' / '+fmt(den));
    const full = (r[0]==null || String(r[0]).trim()==='') ? short[i] : String(r[0]);
    const title = full + ' - ' + (live
      ? (rate.toFixed(1)+'% flip rate, '+counts+' TGLs / calls ran, against the '+target.toFixed(1)+'% target')
      : 'no ROPP calls have run yet in this period, so there is no flip rate to show');
    return flipArc(short[i], p, counts, target, title);
  }).join('');
  let h = `<div class="fliparcs">${gauges}</div>`;
  // As-of: this figure comes from a cache, so always say how current it is (handoff 7.3).
  const stamp = [ (t && t.footer) ? String(t.footer) : '', FLIP.generatedAt ? ('cache pulled '+agoText(FLIP.generatedAt)) : '' ].filter(x=>x);
  // Escape each part, then join with an HTML ENTITY. A literal U+00B7 byte here renders as
  // mojibake (U+00C2 followed by the dot): serve.ps1 reads this file with PS 5.1 Get-Content -Raw,
  // which decodes a BOM-less UTF-8 file as ANSI and turns every multi-byte char into two.
  // That is why this file is ASCII + HTML entities throughout - keep it that way.
  if(stamp.length){ h += `<div class="cav">${stamp.map(esc).join(' &middot; ')}</div>`; }
  // NO goal bar here, deliberately. Each arc already draws a tick at the target and prints a signed
  // ahead/behind delta, so a straight silo-flip-ytd bar underneath repeated the same comparison in a
  // second visual language. Removed 2026-08-11 (DECISIONS.md M9.4). The SILO revenue goal bar is
  // unaffected - it lives in renderSiloRevenueSection() above the gauges and stays a straight bar.
  // The flip block carries its OWN notes (count-weighting, row-vs-distinct counting, why >100% is
  // real). They live on FLIP.block, not on silo-revenue, so they need their own panel or they would
  // never be shown. Separate OPEN_NOTES key -> no collision with the silo-revenue panel.
  h += collapsibleNotes('silo-flip', fb, 'How the flip rate is calculated');
  return h;
}
/* Flip cards, but a throw inside them can only ever cost the flip area. renderSiloFlipCards()
   already returns an errBlock for a missing/errored cache, so this guard is for the unexpected
   case - a malformed cache shape that makes it throw. Without it that throw would reach
   renderSiloRevenueSection's outer catch and blank the WHOLE section, taking the healthy SILO
   revenue figures and the silo-rev-ytd goal bar down with a flip-only failure. The flip is in a
   429 error state as of 2026-08-11, so this separation is load-bearing right now, not theoretical. */
function safeSiloFlipCards(){
  try { return renderSiloFlipCards(); }
  catch(e){ return errBlock({status:'error', error:'flip rate render failed: '+((e&&e.message)||String(e))}, 'SILO flip rate'); }
}
/* SILO revenue + flip rate - same Revenue tab, below the Plumbing section. SOLD/signed pre-tax,
   credited to the turnover-call day; distinct from the Plumbing "billed" figure above. */
function renderSiloRevenueSection(){
  // Presentation isolation: if anything in this section throws (malformed block, unexpected
  // shape, etc.), fall back to an errBlock for SILO ONLY - never let an exception here blank
  // the already-rendered Plumbing section above it in renderRevenue().
  try {
    let h = '<div class="head" style="margin-top:12px; border-top:1px solid var(--hair); padding-top:10px"><h2>Revenue &mdash; SILO</h2>'
          + '<div class="kpi">sold/signed, pre-tax &middot; turnovers</div></div>';
    const b = block('silo-revenue');
    if(!b||b.status==='error'){
      // SILO revenue and the flip rate are INDEPENDENT data sources (the per-day metrics snapshot
      // vs. the precomputed silo-flip cache), so a revenue failure must NOT also hide a perfectly
      // healthy flip figure - it is the goal-tracked headline. Each fails loud on its own.
      return h + errBlock(b,'SILO revenue')
               + `<h3>Flip rate &mdash; TGLs / ROPP calls ran</h3>`
               + safeSiloFlipCards();
    }
    const rev  = asArray(b.tables)[0];   // Period | Revenue  (this block no longer carries a flip table)
    const rr = asArray(rev.rows).map(r=>asArray(r));
    const heroCls = ['today','',''];
    const hero = rr.map((r,i)=>`<div class="revhero ${heroCls[i]||''}"><div class="rl">${esc(r[0])}</div><div class="rv">${esc(noCents(r[1]))}</div></div>`).join('');
    h += `<div class="revcav"><span class="nf">Not final</span>sold estimates keep landing on their turnover day, so Today, MTD and YTD will keep rising (retroactive by design).</div>`;
    h += `<div class="revgrid">${hero}</div>`;
    // SILO revenue goal (DOLLARS, with a pace tick - a cumulative YTD total, same as Plumbing and
    // HVAC Sales). Reads the YTD row of the revenue table, so it is driven by the metrics snapshot
    // and is completely independent of the flip cache below it.
    h += goalBar('silo-rev-ytd', (rr[2]||[])[1]);   // YTD row (Period|Revenue)
    h += `<h3>Flip rate &mdash; TGLs / ROPP calls ran</h3>`;
    h += safeSiloFlipCards();            // separate precomputed cache (FLIP), incl. its own goal bar + as-of
    h += collapsibleNotes('silo-revenue', b);
    return h;
  } catch (e) {
    return '<div class="head" style="margin-top:12px; border-top:1px solid var(--hair); padding-top:10px"><h2>Revenue &mdash; SILO</h2></div>'
         + errBlock({status:'error', error:(e && e.message) || String(e)}, 'SILO revenue');
  }
}

const RENDER = {overview:renderOverview, calls:renderCalls, cancellations:renderCancellations, staffing:renderStaffing, pipeline:renderPipeline, callboard:renderCallBoard, sources:renderSources, revenue:renderRevenue, silo:renderSilo};

function updatePickers(){
  const s = (active==='silo');
  $('dateStatus').style.display  = s ? 'none' : 'flex';
  $('monthStatus').style.display = s ? 'flex' : 'none';
}
function renderNav(){
  // An entry with a href renders as a real link that leaves the page, not a panel switch. The
  // selector below is .tab[data-tab] rather than .tab on purpose: giving the anchor a click
  // handler that calls renderActive() would swallow the navigation.
  $('nav').innerHTML = TABS.map(t=> t.href
    ? `<a class="tab tablink" href="${t.href}" target="_blank" rel="noopener noreferrer" title="Opens the password-protected HR page in a new tab. It always asks for the password.">${esc(t.label)} &#8599;</a>`
    : `<button class="tab ${t.id===active?'active':''}" data-tab="${t.id}">${esc(t.label)}</button>`).join('');
  document.querySelectorAll('.tab[data-tab]').forEach(btn=> btn.onclick=()=>{
    active=btn.dataset.tab; renderNav(); updatePickers(); renderActive();
    if(active==='silo'){ const m=$('monthInput').value||prevMonthStr(); if(siloErr||!siloData||siloData.month!==m) loadSilo(m); }
  });
}
function renderActive(){
  const body = (active==='silo') ? RENDER.silo()
             : (data ? RENDER[active]() : '<div class="wrap"><h2>Loading...</h2></div>');
  $('main').innerHTML = `<div id="${active}" class="panel active">${body}</div>`;
  if(active==='silo') updateSiloChrome();
}
function renderChrome(){
  if(!data) return;
  const prog = data.isToday;
  $('pill').textContent = prog ? 'in progress' : 'final';
  $('pill').className = 'pill ' + (prog ? 'prog' : 'final');
  $('when').innerHTML = `<b>${esc(data.date)}</b><br>pulled ${agoText(data.generatedAt)}`;
}

async function loadVersion(){
  if(STATIC_MODE){
    try{
      const r = await fetch('freshness.json');
      if(!r.ok) throw new Error('HTTP '+r.status);
      const v = await r.json();
      if(!v.generatedAtPac) throw new Error('freshness.json missing generatedAtPac');
      $('verstamp').className = 'verstamp';
      $('verstamp').innerHTML = `Data as of ${esc(v.generatedAtPac)} Pacific`;
    }catch(e){
      $('verstamp').className = 'verstamp';
      $('verstamp').textContent = 'freshness check failed: '+e.message;
    }
    return;
  }
  try{
    const r = await fetch('/api/version');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const v = await r.json();
    if(v.stale){
      $('verstamp').className = 'verstamp staleflag';
      $('verstamp').innerHTML = `&#9888; STALE CODE &mdash; restart the server to load the latest changes<br>`
        + `<span style="font-weight:400;">server started ${esc(v.serverStartPac)} Pacific &middot; code loaded ${esc(v.loadedCodeMtimePac)} Pacific &middot; newer code on disk since ${esc(v.currentCodeMtimePac)} Pacific</span>`;
    } else {
      $('verstamp').className = 'verstamp';
      $('verstamp').innerHTML = `Server started ${esc(v.serverStartPac)} Pacific<br>code: ${esc(v.loadedCodeMtimePac)} Pacific`;
    }
  }catch(e){
    $('verstamp').className = 'verstamp';
    $('verstamp').textContent = 'version check failed: '+e.message;
  }
}

async function load(dateStr){
  $('banner').className='banner';
  beginFetchActivity();
  try{
    const resp = await fetch(metricsUrl(dateStr));
    if(!resp.ok){ let m='HTTP '+resp.status; try{const j=await resp.json(); if(j.error)m=j.error;}catch(e){} throw new Error(m); }
    data = await resp.json();
    await loadGoals();                     // refresh goal values (no-op + no error when GOALS_API is unset)
    await loadFlip();                      // SILO flip-rate cache (own file; never throws - see loadFlip)
    renderChrome(); renderActive(); loadVersion();
    if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
    // 3-min poll: refetch the metrics snapshot AND the flip cache so the wall display stays current.
    if(!STATIC_MODE && dateStr===todayStr()){ pollTimer=setInterval(async()=>{ beginFetchActivity(); try{const r=await fetch(metricsUrl(dateStr)); if(r.ok){data=await r.json();} await loadFlip(); renderChrome(); renderActive(); loadVersion();}catch(e){}finally{ endFetchActivity(); } },180000); }
  }catch(e){
    const hint = STATIC_MODE ? '  (is the static file present in data/?)' : '  (is serve.ps1 running? are the credentials valid?)';
    $('banner').textContent='COULD NOT LOAD DATA: '+e.message+hint;
    $('banner').className='banner show';
  }
  finally{ endFetchActivity(); }
}

/* delegated click handling for the Cancellations filters (data-cx* elements exist only on that tab) */
document.addEventListener('click', e=>{
  const cbd = e.target.closest('[data-cbday]');
  if(cbd){ cbSelDay = cbd.dataset.cbday; if(active==='callboard'){ renderActive(); } return; }
  const c = e.target.closest('[data-cxdim]');
  if(c){ cxToggle(c.dataset.cxdim, c.dataset.cxval); return; }
  if(e.target.closest('[data-cxclear]')){ cxClearAll(); return; }
  // Goal bars: clicking a bar (or the "Set goal" affordance) opens the password-gated editor.
  const gb = e.target.closest('[data-goalkey]');
  if(gb){ openGoalEditor(gb.dataset.goalkey, gb); return; }
  // Click outside the editor closes it (ignore clicks on the editor itself or on a goal bar).
  if($('goalEditor').style.display!=='none' && !e.target.closest('#goalEditor')){ closeGoalEditor(); }
});
$('geSave').addEventListener('click', saveGoal);
$('geCancel').addEventListener('click', closeGoalEditor);
$('geVal').addEventListener('keydown', e=>{ if(e.key==='Enter') saveGoal(); });
$('gePass').addEventListener('keydown', e=>{ if(e.key==='Enter') saveGoal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('goalEditor').style.display!=='none') closeGoalEditor(); });

/* Revenue-tab "How this is calculated" panels: toggle open/closed and remember the state in
   OPEN_NOTES so the 30s auto-re-render (below) doesn't snap an open panel shut while it's being read. */
document.addEventListener('click', e=>{
  const t = e.target.closest('.revnotes-toggle'); if(!t) return;
  const wrap = t.closest('.revnotes'); const key = wrap && wrap.dataset.notekey; if(!key) return;
  if(OPEN_NOTES.has(key)) OPEN_NOTES.delete(key); else OPEN_NOTES.add(key);
  const open = OPEN_NOTES.has(key);
  wrap.classList.toggle('open', open);
  t.setAttribute('aria-expanded', open ? 'true' : 'false');
});

setInterval(()=>{ if(data){ renderChrome(); renderActive(); } loadVersion(); }, 30000);

async function initPickersAndLoad(){
  if(STATIC_MODE){
    try{
      const r = await fetch('manifest.json');
      if(!r.ok) throw new Error('HTTP '+r.status);
      STATIC_MANIFEST = await r.json();
      const dates = asArray(STATIC_MANIFEST.dates).slice().sort();
      if(dates.length===0) throw new Error('manifest.json lists no dates');
      STATIC_TODAY = dates[dates.length-1];
      $('dateInput').min = dates[0]; $('dateInput').max = STATIC_TODAY; $('dateInput').value = STATIC_TODAY;
      const months = asArray(STATIC_MANIFEST.siloMonths).slice().sort();
      if(months.length){ $('monthInput').min = months[0]; $('monthInput').max = months[months.length-1]; $('monthInput').value = months[months.length-1]; }
    }catch(e){
      $('banner').textContent = 'COULD NOT LOAD MANIFEST: '+e.message;
      $('banner').className = 'banner show';
      return;
    }
  } else {
    $('dateInput').value = todayStr(); $('dateInput').max = todayStr();
    // Default to the CURRENT month (live/in-progress), the monthly analogue of defaulting the
    // daily picker to today. Past months remain selectable (max = current month).
    $('monthInput').value = curMonthStr(); $('monthInput').max = curMonthStr();
  }
  $('dateInput').addEventListener('change', ()=> load($('dateInput').value));
  $('monthInput').addEventListener('change', ()=> loadSilo($('monthInput').value));
  renderNav(); updatePickers(); renderActive(); load(effectiveToday());
}
initPickersAndLoad();
</script>
