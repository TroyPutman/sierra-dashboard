name: Deploy dashboard to GitHub Pages

# ---------------------------------------------------------------------------
# What this does, each run:
#   1. Checks out the repo.
#   2. Rebuilds secrets.json from GitHub Actions secrets (gitignored; never committed).
#   3. Refreshes TODAY's snapshot (data/<today>.json) via refresh.ps1.
#   4. If YESTERDAY's snapshot is missing or not yet marked "final", refreshes it once
#      so the day gets frozen. Past frozen days are already committed and are NOT re-pulled.
#   5. Writes a heartbeat file (data/last-refresh.txt) with the UTC + Pacific run time.
#   6. Builds the static site (build-static.ps1 -> site/) with -NoGate: NO client-side
#      password gate. This is a fully PUBLIC dashboard by design -- there is no login of
#      any kind, so there is no password hash to inject.
#   7. Commits the heartbeat + any newly-FROZEN (final:true) data/ snapshots back to the
#      repo on EVERY run. This guarantees repo activity so GitHub does NOT auto-disable the
#      scheduled workflow after 60 days of inactivity. Today's live snapshot and the
#      current/previous-month revenue caches (final:false, change every run) are
#      intentionally NOT committed -- they're rebuilt fresh from the API every run, and
#      committing them constantly caused merge conflicts with manual commits. The message
#      carries [skip ci] so the push does not re-trigger this workflow. secrets.json and
#      site/ are NEVER committed.
#   8. Publishes site/ to GitHub Pages via the official Pages actions
#      (configure-pages -> upload-pages-artifact -> deploy-pages).
#
# FAIL LOUD: if refresh, build, or deploy throws, the job fails and nothing ships.
# There is NO DASH_PASSWORD_HASH and NO login gate -- the dashboard and its underlying
# data/*.json files are intentionally, fully public.
# ---------------------------------------------------------------------------

on:
  # Redeploy on every push to the default branch (any code change ships automatically).
  push:
    branches: ["main"]   # <-- if your default branch is "master", change this to "master".

  # Manual "Run workflow" button in the Actions tab.
  workflow_dispatch:

  # -------------------------------------------------------------------------
  # SCHEDULED CADENCE + ACTIONS-MINUTES QUOTA MATH  (read before changing!)
  #
  # This repo is PUBLIC, so GitHub gives it UNLIMITED free Actions minutes -- the
  # minutes math below is therefore no longer a cost constraint, but the runs/day and
  # runs/month figures still describe how often the dashboard refreshes.
  # GitHub cron is ALWAYS in UTC and does NOT observe daylight saving.
  #
  # Default below = "0,30 13-23 * * 1-6":
  #   * minute 0 and 30  -> every 30 minutes
  #   * hours 13-23 UTC  -> ~06:00-16:30 Pacific in summer (PDT, UTC-7),
  #                          ~05:00-15:30 Pacific in winter (PST, UTC-8)  [1-hr seasonal drift]
  #   * days 1-6         -> Monday through Saturday (no Sundays)
  #
  #   Runs/day  = 2 x 11 hours            = ~22
  #   Runs/month= 22 x 6 days x ~4.345 wk = ~573
  #   Cost/run  ~= 2-3 min (checkout + auth + ~100-200 API calls for today, occasional
  #               +1 day for yesterday, + build + Pages deploy)
  #   => roughly 1,150-1,700 min/month from the schedule alone. On a PUBLIC repo these
  #      minutes are free and unlimited; push- and manual-triggered runs add on top.
  #
  # HOW TO CHANGE THE FREQUENCY (pick one, edit the cron line below):
  #   * Halve the runs  -> hourly: change "0,30" to "0"        (~285 runs/mo)
  #   * Narrow the day  -> e.g. "0,30 14-22 * * 1-5"           (Mon-Fri, fewer hours)
  #   * Cheapest useful -> "0 14 * * 1-5" (once each weekday morning, ~22 runs/mo)
  #   * More frequent   -> add minute marks e.g. "0,15,30,45"  (doubles the runs)
  # -------------------------------------------------------------------------
  schedule:
    - cron: "0,30 13-23 * * 1-6"

# contents:write  -> commit the heartbeat + snapshots back on every run.
# pages:write + id-token:write -> publish to GitHub Pages via the official actions.
permissions:
  contents: write
  pages: write
  id-token: write

# Never run two deploys/commits at once; don't cancel an in-flight run (let it finish
# so the commit-back and push stay serialized -- avoids push races). This also satisfies
# the single-concurrent-deployment requirement of GitHub Pages.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest   # pwsh is preinstalled on ubuntu runners

    # The github-pages environment is required by actions/deploy-pages.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct secrets.json from GitHub secrets
        shell: pwsh
        env:
          ST_CLIENT_ID: ${{ secrets.ST_CLIENT_ID }}
          ST_CLIENT_SECRET: ${{ secrets.ST_CLIENT_SECRET }}
          ST_APP_KEY: ${{ secrets.ST_APP_KEY }}
          ST_TENANT_ID: ${{ secrets.ST_TENANT_ID }}
        run: |
          # Build the EXACT flat shape New-StContext expects:
          #   { clientId, clientSecret, appKey, tenantId }
          # Using ConvertTo-Json so values are properly JSON-escaped.
          $s = [ordered]@{
            clientId     = $env:ST_CLIENT_ID
            clientSecret = $env:ST_CLIENT_SECRET
            appKey       = $env:ST_APP_KEY
            tenantId     = $env:ST_TENANT_ID
          }
          foreach ($k in $s.Keys) {
            if ([string]::IsNullOrWhiteSpace($s[$k])) {
              throw "Missing GitHub Actions secret for '$k'. Set ST_CLIENT_ID / ST_CLIENT_SECRET / ST_APP_KEY / ST_TENANT_ID."
            }
          }
          $s | ConvertTo-Json | Set-Content -Path secrets.json -Encoding utf8
          Write-Host "secrets.json reconstructed (gitignored; will not be committed)."

      - name: Refresh today's snapshot
        shell: pwsh
        run: ./refresh.ps1   # $ErrorActionPreference=Stop under pwsh -> hard failures fail the job

      - name: Finalize yesterday's snapshot if needed
        shell: pwsh
        run: |
          # Use the project's OWN Pacific helpers so "yesterday" is the Pacific day,
          # never the runner's UTC date.
          . ./lib/st-common.ps1
          $pac   = Get-Pac
          $today = Get-TodayPac $pac
          $yest  = $today.AddDays(-1)
          $ys    = $yest.ToString('yyyy-MM-dd')
          $file  = "data/$ys.json"

          $needs = $true
          if (Test-Path $file) {
            $j = Get-Content $file -Raw | ConvertFrom-Json
            if ($j.final -eq $true) { $needs = $false }
          }

          if ($needs) {
            Write-Host "Yesterday ($ys) missing/not final - refreshing once to freeze it."
            ./refresh.ps1 -Date $ys
          } else {
            Write-Host "Yesterday ($ys) already final - skipping (past days are frozen)."
          }

      - name: Write heartbeat file
        shell: pwsh
        run: |
          # A heartbeat that changes every run guarantees there is always something to
          # commit, so the scheduled workflow never goes 60 days without repo activity
          # (which is when GitHub auto-disables schedules on a repo). Stamp it in both
          # UTC and Pacific using the project's own Pacific helper.
          . ./lib/st-common.ps1
          $pac    = Get-Pac
          $nowUtc = [DateTime]::UtcNow
          $nowPac = [TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::SpecifyKind($nowUtc, 'Utc'), $pac)
          $lines  = @(
            "last-refresh (UTC):     " + $nowUtc.ToString('yyyy-MM-dd HH:mm:ss') + " UTC"
            "last-refresh (Pacific): " + $nowPac.ToString('yyyy-MM-dd HH:mm:ss') + " America/Los_Angeles"
          )
          $lines | Set-Content -Path data/last-refresh.txt -Encoding utf8
          Write-Host "Wrote data/last-refresh.txt"

      - name: Build static site (fully public; no login gate)
        shell: pwsh
        run: |
          # -NoGate: this is an intentionally public, no-login dashboard, so there is no
          # client-side password gate and no password hash to inject.
          pwsh ./build-static.ps1 -OutDir site -NoGate

      - name: Commit heartbeat + frozen snapshots (every run, keeps schedule alive)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Narrowed on purpose: we do NOT `git add data/` wholesale anymore. That used
          # to commit today's live snapshot and the current/previous-month revenue caches
          # on every single run (they change every run, since they're volatile/final:false),
          # which caused manual commits and this workflow's own commits to collide and
          # produce merge conflicts on data/*.json.
          #
          # Instead: always stage the heartbeat, and stage a changed/untracked data/*.json
          # file ONLY if it is a FROZEN snapshot/cache -- i.e. its JSON has a top-level
          # "final": true. That captures newly-finalized past days (e.g. yesterday, once
          # frozen) and any newly-frozen revenue month cache, while excluding today's live
          # snapshot and any still-open (final:false) revenue month cache. Those are
          # rebuilt fresh every run from the API and never need to be committed --
          # build-static.ps1 reads them straight from the working directory regardless.
          #
          # secrets.json lives at repo root (not data/) AND is gitignored, so it can never
          # be staged here. site/ is gitignored and never committed.
          git add data/last-refresh.txt

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            f="${line:3}"
            case "$f" in
              data/*.json)
                if [ -f "$f" ] && grep -Eq '"final":[[:space:]]*true' "$f"; then
                  git add "$f"
                fi
                ;;
            esac
          done <<< "$(git status --porcelain -- data/)"

          if git diff --cached --quiet; then
            # Nothing frozen changed this run (heartbeat somehow unchanged too) -- kept
            # as a safety net so an unchanged tree does not fail the job.
            echo "Nothing to commit (unexpected -- heartbeat should always change)."
          else
            # [skip ci] + GITHUB_TOKEN pushes don't re-trigger this workflow (no loop).
            git commit -m "Refresh: heartbeat + frozen snapshots [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
